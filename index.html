<title>TOGA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral+SC:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: mesa de trabalho do advogado — barra de status no topo, agenda à esquerda, pastas de processo à direita */
:root{
  --bg:#E7EAEE; --surface:#F6F7F9; --ink:#1A2130; --muted:#5B6474; --line:#C9CED6;
  --folder:#EFE3C2; --folder-edge:#D9C893; --brass:#9C7A22; --brass-soft:#E9DDB8;
  --win:#2E7D4F; --loss:#B23A35; --warn:#B7791F;
  --r-comum:#7D838D; --r-incomum:#3E8E5A; --r-raro:#2F6DB5; --r-epico:#7B4BB3; --r-lendario:#C27C12;
  --b-case:#2F6DB5; --b-estudo:#7B4BB3; --b-lazer:#3E8E5A; --b-apoio:#9C7A22; --b-descanso:#D3D8DF; --b-familia:#C2577A; --b-saude:#2A9D8F;
  --overlay:rgba(16,20,28,.55); --land:#D3DAE3; --land-edge:#A9B3C1; --water:#C3D6E8;
  --f-display:"Spectral SC", "Cormorant SC", Georgia, serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151B; --surface:#1B2029; --ink:#E6E3DA; --muted:#9AA2B0; --line:#2E3542;
  --folder:#2A2619; --folder-edge:#4A4125; --brass:#D7B357; --brass-soft:#3A331C;
  --win:#5DBB85; --loss:#E2716B; --warn:#E0A84A;
  --r-comum:#9BA1AB; --r-incomum:#5DBB85; --r-raro:#6EA2E6; --r-epico:#A985DA; --r-lendario:#E6A53C;
  --b-case:#4F8BD6; --b-estudo:#9670CC; --b-lazer:#4FA874; --b-apoio:#C9A440; --b-descanso:#2E3542; --b-familia:#D9789A; --b-saude:#46BBAA;
  --overlay:rgba(0,0,0,.65); --land:#232A35; --land-edge:#3B4554; --water:#1D2D3E; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12151B; --surface:#1B2029; --ink:#E6E3DA; --muted:#9AA2B0; --line:#2E3542;
  --folder:#2A2619; --folder-edge:#4A4125; --brass:#D7B357; --brass-soft:#3A331C;
  --win:#5DBB85; --loss:#E2716B; --warn:#E0A84A;
  --r-comum:#9BA1AB; --r-incomum:#5DBB85; --r-raro:#6EA2E6; --r-epico:#A985DA; --r-lendario:#E6A53C;
  --b-case:#4F8BD6; --b-estudo:#9670CC; --b-lazer:#4FA874; --b-apoio:#C9A440; --b-descanso:#2E3542; --b-familia:#D9789A; --b-saude:#46BBAA;
  --overlay:rgba(0,0,0,.65); --land:#232A35; --land-edge:#3B4554; --water:#1D2D3E; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.02em;margin:0;text-wrap:balance}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}

/* Barra de status */
.top{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:12px 0 14px;border-bottom:2px solid var(--ink);margin-bottom:16px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:28px;line-height:1}
.brand span{color:var(--muted);font-size:12px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-mono);font-size:15px;font-weight:600}
.meter{width:88px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--brass)}
.meter.e i{background:var(--win)} .meter.s i{background:var(--loss)}

.grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel-head h2{font-size:18px}

/* Agenda */
.blocks{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.blocks .day{font-size:10px;text-align:center;color:var(--muted);font-family:var(--f-mono)}
.blk{height:16px;border-radius:2px;background:var(--b-descanso)}
.blk.case{background:var(--b-case)} .blk.familia{background:var(--b-familia)} .blk.saude{background:var(--b-saude)} .blk.estudo{background:var(--b-estudo)} .blk.lazer{background:var(--b-lazer)} .blk.apoio{background:var(--b-apoio)}
.blk.off{background:repeating-linear-gradient(45deg,var(--line) 0 3px,transparent 3px 6px)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.step button{width:28px;height:26px;border:0;background:transparent}
.step button:hover:not(:disabled){background:var(--brass-soft)}
.step button:disabled{opacity:.35;cursor:default}
.step span{min-width:24px;text-align:center;font-family:var(--f-mono)}
select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:3px 6px;max-width:100%}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:4px;font-weight:600}
.btn:hover{filter:brightness(1.15)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.brass{background:var(--brass);border-color:var(--brass);color:#fff}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.btn.wide{width:100%}

/* Pastas de processo */
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px 16px}
.folder{position:relative;background:var(--folder);border:1px solid var(--folder-edge);border-radius:2px 6px 6px 6px;padding:16px 14px 14px;margin-top:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.folder::before{content:attr(data-area);position:absolute;top:-15px;left:-1px;height:15px;padding:0 12px;background:var(--folder);border:1px solid var(--folder-edge);border-bottom:0;border-radius:5px 5px 0 0;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--muted);line-height:15px}
.stamp{position:absolute;top:10px;right:10px;transform:rotate(-6deg);border:2px solid currentColor;padding:1px 7px;font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;border-radius:3px}
.folder h3{font-size:16px;line-height:1.2;padding-right:84px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px}
.meta dt{color:var(--muted)} .meta dd{margin:0;min-width:0;text-align:right}
.bar{position:relative;height:7px;background:color-mix(in srgb,var(--ink) 12%,transparent);border-radius:4px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.vs{display:grid;grid-template-columns:76px 1fr 30px;gap:4px 8px;align-items:center;font-size:12px}
.chance{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px dashed var(--folder-edge);padding-top:8px}
.chance strong{font-family:var(--f-display);font-size:34px;line-height:1}
.hi{color:var(--win)} .mid{color:var(--warn)} .lo{color:var(--loss)}
details summary{cursor:pointer;font-size:12px;color:var(--muted)}
.break{list-style:none;margin:6px 0 0;padding:0;font-size:12px;display:flex;flex-direction:column;gap:2px}
.break li{display:flex;justify-content:space-between;gap:8px}
.ctl{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--folder-edge);padding-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--folder-edge);background:transparent;border-radius:999px;padding:3px 9px;font-size:11.5px}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip:disabled{opacity:.4;cursor:default}
.chip.bad.on{background:var(--loss);border-color:var(--loss);color:#fff}
.actions{display:flex;gap:8px}
.actions .btn{flex:1}
.empty{color:var(--muted);font-size:13px;padding:10px 0}
.tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:3px;background:var(--brass-soft);color:var(--ink);font-weight:600;letter-spacing:.03em}

/* Diário */
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto;font-size:12.5px}
.log li{display:grid;grid-template-columns:34px 1fr;gap:8px}
.log .w{color:var(--muted);font-family:var(--f-mono)}
.log .g{color:var(--win)} .log .r{color:var(--loss)}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:12px}
.skills div{display:grid;grid-template-columns:1fr 28px;gap:6px;align-items:center}
.skills .bar{grid-column:1/-1;height:4px}

/* Modal */
.ov{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--brass);border-radius:6px;width:min(520px,100%);max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal h2{font-size:22px}
.modal p{margin:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;border:1px solid var(--line);background:transparent;border-radius:5px;padding:10px 12px}
.opt:hover{border-color:var(--brass);background:var(--brass-soft)}
.opt small{color:var(--muted);grid-column:1/-1}
.opt b.num{font-size:18px}
/* Balança do veredito */
.scale{position:relative;height:46px;border-radius:5px;overflow:hidden;background:color-mix(in srgb,var(--loss) 22%,var(--surface));border:1px solid var(--line)}
.scale .zone{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--win) 35%,var(--surface));border-right:2px solid var(--win)}
.scale .hist{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--brass) 45%,transparent)}
.scale .ptr{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;background:var(--ink);border-radius:2px;box-shadow:0 0 0 2px var(--surface)}
.scale-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.verdict{font-family:var(--f-display);font-size:30px;text-align:center;letter-spacing:.06em;transform:rotate(-2deg);border:3px solid currentColor;border-radius:6px;padding:4px 10px;align-self:center}
.verdict[hidden]{display:none!important}
.res{display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.start-traits{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.start-traits .chip{border-radius:5px;padding:7px 9px;text-align:left;font-size:12.5px;border-color:var(--line)}
.field{display:flex;flex-direction:column;gap:4px}
.field input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:7px 9px}
/* Abas e mapa */
.tabs{display:flex;flex-wrap:wrap;gap:4px;width:100%}
.tab{border:1px solid var(--line);background:transparent;padding:6px 14px;border-radius:4px;font-weight:600}
.tab.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:20px;align-items:start}
@media (max-width:860px){.mapgrid{grid-template-columns:minmax(0,1fr)}}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;min-width:0;display:flex;flex-direction:column;gap:8px}
.mapbox svg{display:block;width:100%;height:auto;max-height:78vh}
.land{fill:var(--land);stroke:var(--land-edge);stroke-width:1.5;stroke-linejoin:round}
.grat{stroke:var(--line);stroke-width:.6;stroke-dasharray:2 4;fill:none}
.route{stroke:var(--brass);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-dasharray:6 6;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-12}}
.city{cursor:pointer;outline:none}
.city circle.dot{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.city.off circle.dot{fill:var(--brass);stroke:var(--brass)}
.city circle.halo{fill:var(--brass);opacity:.22}
.city circle.ring{fill:none;stroke:transparent;stroke-width:2}
.city.sel circle.ring{stroke:var(--ink)}
.city:focus-visible circle.ring{stroke:var(--brass)}
.city text{font-family:var(--f-body);font-size:11px;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round}
.city text.lbl-sede{font-family:var(--f-mono);font-size:8.5px;font-weight:600;fill:var(--brass);letter-spacing:.1em}
.city .badge circle{fill:var(--b-case)}
.city .badge text{fill:#fff;stroke:none;font-family:var(--f-mono);font-size:9px}
.dem{display:grid;grid-template-columns:90px 1fr;gap:5px 8px;align-items:center;font-size:12px}
.region-edge{fill:var(--land);stroke:var(--land-edge);stroke-width:4;stroke-linejoin:round}
.district{fill:var(--land);stroke:var(--surface);stroke-width:2.5;stroke-linejoin:round}
.district.off{fill:color-mix(in srgb,var(--brass) 22%,var(--land))}
.wdot{fill:var(--land-edge)}
.water{fill:var(--water)}
.river{fill:none;stroke:var(--water);stroke-width:12;stroke-linecap:round}
.water-lbl{font-family:var(--f-body);font-size:10.5px;font-style:italic;fill:var(--muted)}
/* Planta em blueprint: visual único, independente do tema */
.bp-bg{fill:#0F4C8A}
.bp-g1{fill:none;stroke:rgba(255,255,255,.07);stroke-width:.6} .bp-g2{fill:none;stroke:rgba(255,255,255,.16);stroke-width:.8}
.bp-frame{fill:none;stroke:rgba(234,243,255,.7);stroke-width:1} .bp-frame.fino{stroke:rgba(234,243,255,.3);stroke-width:.6}
.bp-floor{fill:rgba(255,255,255,.035)}
.bp-wall{fill:none;stroke:#F4F8FF;stroke-width:3}
.bp-wall-ext{fill:none;stroke:#F4F8FF;stroke-width:9} .bp-wall-oco{fill:none;stroke:#0F4C8A;stroke-width:4}
.bp-gap{fill:#0F4C8A}
.f{fill:rgba(234,243,255,.06);stroke:#EAF3FF;stroke-width:1.1} .fl{fill:none;stroke:#EAF3FF;stroke-width:1}
.fd{fill:none;stroke:#9FD3FF;stroke-width:.9;stroke-dasharray:3 2.5}
.balcao{fill:none;stroke:#EAF3FF;stroke-width:8;stroke-linecap:square;stroke-linejoin:miter;stroke-opacity:.9}
.bp-tv{stroke:#EAF3FF;stroke-width:3} .bp-led{fill:#8FE3FF;stroke:none}
.bp-t{font-family:var(--f-mono);font-size:8.5px;font-weight:600;letter-spacing:.12em;fill:#F4F8FF}
.bp-a{font-family:var(--f-mono);font-size:7.5px;letter-spacing:.06em;fill:#9FD3FF}
.bp-dim{stroke:#9FD3FF;stroke-width:.8} .bp-dim.fino{stroke-opacity:.45;stroke-dasharray:2 2}
.bp-dimt{font-family:var(--f-mono);font-size:8px;letter-spacing:.06em;fill:#CFE8FF}
.bp-empty{fill:none;stroke:rgba(234,243,255,.4);stroke-width:1;stroke-dasharray:5 4} .bp-empty.x{stroke-opacity:.35;stroke-dasharray:2 5}
.bp-chip{fill:#0F4C8A;stroke:rgba(234,243,255,.5);stroke-width:.8}
.bp-empty-t{font-family:var(--f-mono);font-size:8.5px;font-weight:600;letter-spacing:.12em;fill:rgba(234,243,255,.8)}
.bp-hit{fill:transparent;stroke:transparent;stroke-width:3}
.slot{cursor:pointer;outline:none} .slot:hover .bp-hit{stroke:rgba(234,243,255,.45)}
.slot.sel .bp-hit{stroke:#8FE3FF;filter:url(#bpGlow)} .slot:focus-visible .bp-hit{stroke:#FFC857}
.slot:hover .bp-empty-t{fill:#fff}
.bp-seta{fill:#EAF3FF} .bp-esc-a{fill:#EAF3FF} .bp-esc-b{fill:none;stroke:#EAF3FF;stroke-width:.8}
.pessoa{fill:#8FE3FF;stroke:#F4F8FF;stroke-width:1.5} .pessoa.gest{fill:#FFC857} .pessoa.voce{fill:#F4F8FF}
.pessoa-t{font-family:var(--f-mono);font-size:7.5px;font-weight:600;fill:#0B3566}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:60;pointer-events:none;max-width:calc(100vw - 32px)}
.toast{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:6px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;width:280px;max-width:100%;box-shadow:0 6px 24px rgba(0,0,0,.18);animation:tin .35s ease-out;transition:opacity .4s,transform .4s}
.toast b{font-family:var(--f-display,inherit);font-size:15px} .toast small{color:var(--muted);font-size:12px} .toast .label{color:var(--tc)}
.toast.sai{opacity:0;transform:translateY(8px)}
@keyframes tin{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.cqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.cq{border:1px dashed var(--line);border-radius:6px;padding:9px 10px;display:flex;flex-direction:column;gap:5px;opacity:.72}
.cq.on{opacity:1;border:1px solid var(--tc);border-left-width:4px;background:color-mix(in srgb,var(--tc) 7%,transparent)}
.cq-top{display:flex;justify-content:space-between;gap:6px;align-items:baseline} .cq-top b{font-size:13px} .cq-top .num{color:var(--tc);font-size:12px}
.cq small{color:var(--muted);font-size:11.5px;line-height:1.35}
.hall{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.hall li{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:7px 8px;border:1px solid var(--line);border-radius:5px}
.hall li.top{border-color:var(--r-lendario);background:color-mix(in srgb,var(--r-lendario) 8%,transparent)}
.hall li small{display:block;color:var(--muted);font-size:11.5px} .hall .pos{color:var(--muted)} .hall .pts{font-size:16px;color:var(--brass)}
.conta-box:empty{display:none}
.conta-box{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;font-size:12.5px;padding:9px 10px;border:1px dashed var(--line);border-radius:5px}
.hall-online:empty,.hall-inicio:empty{display:none} .hall-online{display:flex;flex-direction:column;gap:6px}
</style>

<div id="app"></div>
<div id="modal-root"></div>

<script>
(() => {
// ===================== DADOS =====================
const SKILLS = {penal:'Penal',civel:'Cível',trabalho:'Trabalho',familia:'Família',empresarial:'Empresarial',tributario:'Tributário',
  oratoria:'Oratória',escrita:'Escrita',pesquisa:'Pesquisa',negociacao:'Negociação',analise:'Análise',didatica:'Didática'};
const AREAS = {
  penal:{nome:'Penal',skills:{penal:.5,analise:.3,oratoria:.2}},
  civel:{nome:'Cível',skills:{civel:.5,escrita:.3,pesquisa:.2}},
  trabalho:{nome:'Trabalho',skills:{trabalho:.5,escrita:.25,negociacao:.25}},
  familia:{nome:'Família',skills:{familia:.5,negociacao:.3,oratoria:.2}},
  empresarial:{nome:'Empresarial',skills:{empresarial:.5,analise:.25,escrita:.25}},
  tributario:{nome:'Tributário',skills:{tributario:.5,pesquisa:.3,escrita:.2}},

function temEscritorio(k){ const C=LOC[k]; if(!C) return false; if(S.carreira!=='adv') return k===comarcaAtual(); if(C.centro) return temEscritorio(C.parent); return k===S.sede||S.filiais.includes(k); }
function longe(c){ const C=LOC[c.cidade]; return !temEscritorio(c.cidade) && !(C.nivel==='regional' && temEscritorio(C.parent)); }
const maxCasos=()=>MAX_CASOS+S.filiais.length;
const custoSemanal=()=>despesasEscritorio().total;
function pickW(arr,w){const ws=arr.map(w); let r=Math.random()*ws.reduce((a,b)=>a+b,0);
  for(let i=0;i<arr.length;i++){ r-=ws[i]; if(r<=0) return arr[i]; } return arr[arr.length-1];}
function pesosRaridade(C){const p=S.prest, f=S.filiais.length;
  return {comum:Math.max(10,60-p*.6),incomum:30,raro:8+p*.3+C.pop*1.5+f*2+(C.rarBonus||0),
    epico:(p>=35?(p-30)*.4:0)+(p>=25?f:0),lendario:p>=65?(p-60)*.15:0};}
function sortearRaridade(C,extra={}){const w=pesosRaridade(C); for(const k in extra) w[k]+=extra[k]; let tot=0; for(const k in w) tot+=w[k];
  let r=Math.random()*tot; for(const k of RORD){ r-=w[k]; if(r<=0) return k;} return 'comum';}
function novoCaso(cid=S.sede,extra={},area=null){
  const C=LOC[cid];
  let rar=sortearRaridade(C,extra); let pool=TEMPLATES.filter(t=>t.rars.includes(rar)&&(!area||t.area===area));
  if(!pool.length){ pool=TEMPLATES.filter(t=>t.area===area); }
  const t=pickW(pool,x=>(C.areas[x.area]||1)*(tem(x.area,1)?1.5:1)*(tem(x.area,3)?1.5:1)); if(!t.rars.includes(rar)) rar=t.rars[t.rars.length-1]; const R=RAR[rar];
  const d=rint(R.d[0],R.d[1]);
  const valor=Math.round(5000*Math.pow(1.1,d)*rnd(.8,1.2)*C.fator/100)*100;
  const cliente = t.area==='empresarial' ? pick(EMPRESAS) : pick(NOMES);
  return {id:++uid,...t,rar,d,valor,hon:Math.round(valor*.2),cliente,cidade:cid,
    prazo:rint(R.prazo[0],R.prazo[1]),juiz:pick(Object.keys(JUIZES)),juizNome:pick(JNOMES),
    inst:1,lado:null,prep:0,semana:0,apoios:{},estrategia:'equilibrada',mod:0,acordoFalhou:false,perdaOrig:0,retido:false};
}
function gerarOfertas(){
  const of=[novoCaso(S.sede),novoCaso(S.sede),novoCaso(S.sede)];
  for(const f of S.filiais) of.push(novoCaso(f));
  if(temSala('recepcao')) of.push(novoCaso(S.sede));
  const fora=Object.keys(LOC).filter(k=>{const C=LOC[k]; return !temEscritorio(k) && !C.centro && (C.nivel!=='global'||S.prest>=40) && (C.nivel!=='regional'||temEscritorio(C.parent));});
  if(fora.length && Math.random()<.6){ const c=novoCaso(pickW(fora,k=>LOC[k].pop)); c.indicacao=true; of.push(c); }
  if(S.carreira==='adv'){ for(const c of of) marcarNPC(c); indicacoes(of); }
  S.ofertas=of;
}
// épico e lendário envolvem questão constitucional e podem chegar ao STF (recurso extraordinário)
function maxInst(c){const r=RORD.indexOf(c.rar); return r>=3?4:r>=2?3:2;}
function prepBonus(n){let b=0; for(let i=1;i<=n;i++) b+=Math.max(0,6-i); return b;}
function skillCaso(c){let s=0; const w=AREAS[c.area].skills; for(const k in w) s+=w[k]*S.skills[k];
  if(LOC[c.cidade]&&LOC[c.cidade].sistema==='common') s=.8*s+.2*S.skills.oratoria; return s;}
function tesesDoCaso(c){return S.teses.filter(t=>t.area===c.area).sort((a,b)=>b.bonus-a.bonus).slice(0,tem('pesquisa',2)?4:3);}

function calcChance(c,extra=0){
  const items=[]; const add=(l,v)=>{ if(v) items.push([l,v]); };
  const skill=skillCaso(c);
  const blocos=c.prep+(c.semana||0);
  let pb=prepBonus(blocos); if(c.juiz==='impaciente') pb*=.6;
  add(`Preparação (${blocos} bloco${blocos===1?'':'s'})`,pb);
  const lg=longe(c);
  for(const k in c.apoios) if(c.apoios[k] && (!APOIOS[k].longe||lg)) add(APOIOS[k].nome,APOIOS[k].bonus);
  if(lg) add('Distância (sem escritório em '+LOC[c.cidade].nome+')',-10);
  if(c.estrategia!=='acordo') add('Estratégia '+ESTR[c.estrategia].nome.toLowerCase(),ESTR[c.estrategia].mod);
  add('Prestígio',(S.prest-50)/10);
  const j=c.juiz;
  if(j==='rigoroso') add('Juiz rigoroso',-5);
  if(j==='garantista' && c.area==='penal') add('Juiz garantista',5);
  if(j==='formalista') add('Juiz formalista',S.skills.escrita>=50?5:-5);
  if(S.energia<30) add('Cansaço',-10);
  if(S.estresse>70) add('Estresse alto',-8);
  if(S.traits.includes('orador') && c.juri) add('Orador nato (júri)',5);
  if(S.traits.includes('ansioso') && RORD.indexOf(c.rar)>=3) add('Ansiedade',-5);
  if(S.traits.includes('sortudo')) add('Sortudo',3);
  for(const t of tesesDoCaso(c)) add('Tese: '+t.nome,t.bonus);
  if(c.inst>1){ add(INST[c.inst],-10*(c.inst-1)); add(c.lado==='recorrido'?'Decisão a seu favor':'Decisão contrária',c.lado==='recorrido'?10:-10); }
  bonusNPC(c,add);
  if(S.ex&&S.semana<S.ex.ate&&c.cidade===S.ex.comarca) add('Quarentena de ex-'+S.ex.cargo.toLowerCase(),-5);
  bonusPerks(c,add); add('Audiência',c.mod); add('Esta jogada',extra);
  const bonus=items.reduce((a,x)=>a+x[1],0);
  let ch=sig((skill+bonus-c.d)/12);
  if(c.juri) ch=.5+(ch-.5)*.8;
  return {skill,bonus,items,ch:clamp(ch,.05,.95)};
}
function chanceAcordo(c){let v=.55+S.skills.negociacao/200+(tem('negociacao',1)?.1:0)+(temSala('reuniao')?.1:0)+(c.npcAdv&&npcTipo(npcPor(c.npcAdv))==='amigo'?.1:0);
  if(c.juiz==='pragmatico') v+=.10; if(S.traits.includes('carismatico')) v+=.10; return clamp(v,.05,.95);}
function chanceApeloAdv(c,hist){return clamp(RAR[c.rar].apelo+ADV[c.adv].apelo-(hist?.25:0),.05,.95);}

function blocosUsados(){let n=S.agenda.estudo+S.agenda.lazer+vidaBlocos()+acadBlocos()+estudBlocos();

  if(S.carreira==='defensor') for(const c of S.d.casos) n+=c.semana||0;

const mroot=document.getElementById('modal-root');
function modal(html,botoes,onMount){
  return new Promise(res=>{
    mroot.innerHTML=`<div class="ov"><div class="modal" role="dialog" aria-modal="true">${html}
      ${botoes&&botoes.length?`<div class="actions">${botoes.map((b,i)=>`<button class="btn ${b.cls||''}" data-mi="${i}" ${b.dis?'disabled':''}>${b.t}</button>`).join('')}</div>`:''}</div></div>`;
    const box=mroot.querySelector('.modal');
    box.addEventListener('click',e=>{const b=e.target.closest('[data-mi],[data-mv]'); if(!b||b.disabled) return;
      const v=b.dataset.mv!==undefined?b.dataset.mv:botoes[+b.dataset.mi].v; mroot.innerHTML=''; res(v);});
    if(onMount) onMount(box);
    const f=box.querySelector('button:not(:disabled)'); if(f) f.focus();
  });
}
const reduz=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function balanca(box,ch,r,hist=0){
  return new Promise(done=>{
    const ptr=box.querySelector('.ptr'); const dur=reduz?0:2300; const t0=performance.now();
    const step=now=>{const t=Math.min(1,(now-t0)/(dur||1)); const k=t*2.3;
      const pos=dur? clamp(r+.55*Math.exp(-2.6*k)*Math.sin(11*k)*(1-t),0,1):r;
      ptr.style.left=(pos*100)+'%'; if(t<1) requestAnimationFrame(step); else done();};
    requestAnimationFrame(step);
  });
}
function htmlBalanca(ch,hist,l='vitória',r='derrota'){return `<div class="scale"><div class="zone" style="width:${ch*100}%"></div>${hist?`<div class="hist" style="width:${hist*100}%"></div>`:''}<div class="ptr" style="left:50%"></div></div>
  <div class="scale-lbl"><span>◀ ${l}${hist?' (dourado: histórica)':''}</span><span>${r} ▶</span></div>`;}

// rolagem simples com balança, para eventos com chance
async function rolar(titulo,texto,ch,okTxt,failTxt){
  const r=Math.random(); const ok=r<=ch;
  await modal(`<h2>${titulo}</h2><p>${texto}</p><p class="num">Chance: <b>${pct(ch)}</b></p>${htmlBalanca(ch,0,okTxt.toLowerCase(),failTxt.toLowerCase())}
    <div class="verdict ${ok?'hi':'lo'}" hidden>${ok?okTxt:failTxt}</div>`,[{t:'Continuar',v:1,dis:true}],async box=>{
      await balanca(box,ch,r); box.querySelector('.verdict').hidden=false; const b=box.querySelector('[data-mi]'); b.disabled=false; b.focus();});
  return ok;
}

function ganharXp(c,mult){
  const w=AREAS[c.area].skills;
  for(const k in w){ S.skills[k]=clamp(S.skills[k]+w[k]*4*RAR[c.rar].xp*mult*(1-S.skills[k]/110),0,100); }

async function audiencia(c){
  if(Math.random()<.3) await reviravolta(c);
  await momentoDecisivo(c);
  const cc=calcChance(c), ch=cc.ch, r=Math.random();
  const res = r<=ch*.15?'historica': r<=ch?'vitoria': (r>.95&&ch<.5)?'feia':'derrota';
  const win = res==='historica'||res==='vitoria';
  const E=ESTR[c.estrategia], R=RAR[c.rar];
  const nomes={historica:'Vitória histórica',vitoria:'Procedente',derrota:'Improcedente',feia:'Derrota feia'};
  // efeitos
  let dPrest=0, linhas=[];
  if(win){
    if(c.lado==='recorrido') dPrest=res==='historica'?2:1;
    else if(c.lado==='recorrente') dPrest=R.ganho+c.perdaOrig/2;
    else dPrest=R.ganho*(E.win||1)*(res==='historica'?2:1);
    S.vitorias++; S.estresse=clamp(S.estresse-5,0,100); ganharXp(c,1); cqVitoria(c,res);
  } else {
    if(c.lado==='recorrido') dPrest=-R.perda;

let ocupado=false;
async function fimSemana(){
  if(S.carreira==='juiz') return fimSemanaJuiz();
  if(S.carreira==='promotor') return fimSemanaMP();
  if(S.carreira==='defensor') return fimSemanaDP();
  if(S.carreira==='estudante') return fimSemanaEstudante();
  if(S.carreira==='academico') return fimSemanaAcademico();
  if(ocupado) return; ocupado=true;
  try{
    autoDistribuir();
    const gabA=gabinete(), trab=Math.max(0,trabalhoSemana()-gabA), lazer=S.agenda.lazer, desc=Math.max(0,S.disp+blocoEscrita()-trab-lazer-vidaBlocos());
    // agenda → preparação
    for(const c of S.casos){ c.prep+=c.semana||0; c.semana=0; for(const k in c.apoios) if(c.apoios[k]===1) c.apoios[k]=2; }
    if(S.agenda.estudo){ const k=S.agenda.estudoSkill, mult=(S.traits.includes('rato')?1.5:1)*(tem('pesquisa',3)?1.5:1);
      for(let i=0;i<S.agenda.estudo;i++) S.skills[k]=clamp(S.skills[k]+1.1*mult*(1-S.skills[k]/110),0,100);
      S.estudoTotal=(S.estudoTotal||0)+S.agenda.estudo; addLog(`Estudou ${SKILLS[k]} por ${S.agenda.estudo} bloco(s).`); }
    S.energia=clamp(S.energia-3.2*trab*(S.traits.includes('workaholic')?.7:1)+3*desc+1.5*lazer,0,100);
    S.estresse=clamp(S.estresse+2.2*trab*(S.traits.includes('ansioso')?1.25:1)-1.2*desc-6*lazer,0,100);
    // acordos
    for(const c of [...S.casos]){
      if(c.estrategia!=='acordo') continue;
      const ok=await rolar(`Tentativa de acordo · ${esc(c.titulo)}`,`Negociação ${Math.round(S.skills.negociacao)}${c.juiz==='pragmatico'?' · juiz pragmático':''}${S.traits.includes('carismatico')?' · carismático':''}.`,chanceAcordo(c),'Acordo fechado','Sem acordo');
      if(ok){ const val=c.valor*fracAcordo(), hon=Math.round(val*.2);
        S.caixa+=hon; S.u.honSemana+=hon; S.casos=S.casos.filter(x=>x.id!==c.id); S.vitorias++;
        addLog(`Acordo em “${c.titulo}”: ${brl(val)} acordados, ${brl(hon)} de honorários.`,'g');
      } else { c.estrategia='equilibrada'; c.acordoFalhou=true; addLog(`Acordo falhou em “${c.titulo}”. O caso segue para julgamento.`,'r'); }
    }
    // prazos e audiências
    for(const c of S.casos) c.prazo--;
    const hoje=S.casos.filter(c=>c.prazo<=0);
    S.casos=S.casos.filter(c=>c.prazo>0);
    for(const c of hoje) await audiencia(c);
    semanaEstruturaAdv();
    if(S.u.pedidoSoc) await pedidoSociedade();
    // próxima semana
    await semanaAcademia(); if(await semanaVida()) return;
    S.semana++; S.agenda.estudo=0; S.agenda.lazer=0;
    S.disp=BLOCOS-blocosPerdidos();
    if(S.estresse>=100){ S.disp=10; S.estresse=70; addLog('Burnout: você só terá 10 blocos na próxima semana.','r'); }
    else if(S.energia<=0){ S.disp=14; addLog('Exaustão: você só terá 14 blocos na próxima semana.','r'); }
    gerarOfertas();
    if(S.caixa<-25000){ S.fim='falencia'; }
    else if(S.prest<=0){ S.fim='reputacao'; }
    salvar(); render();
    if(S.fim){
      await modal(`<h2 class="lo">${S.fim==='falencia'?'Falência':'Carreira encerrada'}</h2><p>${S.fim==='falencia'?'O caixa passou de −R$ 25 mil e o escritório fechou.':'Seu prestígio chegou a zero e nenhum cliente quer mais contratar você.'} Você durou ${S.semana-1} semanas, com ${S.vitorias} vitórias e ${S.derrotas} derrotas.</p>`,[{t:'Nova carreira',v:1,cls:'brass'}]);
      hallRegistrar(S.fim==='falencia'?'falencia':'encerrada'); S=null; apagarSave(); render();
    } else if(!S.metaAtingida && S.prest>=META_PREST){
      S.metaAtingida=true; salvar();
      await modal(`<h2 class="hi">Meta atingida</h2><p>Em ${S.semana-1} semanas você chegou a ${Math.round(S.prest)} de prestígio, com ${brl(S.caixa)} em caixa. No jogo completo, aqui você abriria o escritório de verdade e contrataria a primeira equipe.</p>`,[{t:'Continuar jogando',v:1,cls:'brass'}]);
    }
  } finally { ocupado=false; render(); }
}

function calcAcerto(p){
  const items=[]; const add=(l,v)=>{ if(v) items.push([l,v]); };
  const skill=.5*S.skills[p.area]+.3*S.skills.escrita+.2*S.skills.analise;
  const n=p.semana||0; add(`Estudo do processo (${n} bloco${n===1?'':'s'})`,prepBonus(n));
  if(S.j.cargo>=2) add('Decisão colegiada',5);
  if(S.energia<30) add('Cansaço',-10);
  if(S.estresse>70) add('Estresse alto',-8);
  if(S.traits.includes('ansioso') && RORD.indexOf(p.rar)>=3) add('Ansiedade',-5);
  if(S.traits.includes('sortudo')) add('Sortudo',3);
  if(S.traits.includes('rato')) add('Rato de biblioteca',2);
  bonusPerks(p,add); add('Eventos do processo',p.mod);
  const bonus=items.reduce((a,x)=>a+x[1],0);
  let ch=sig((skill+bonus-p.d)/12); if(p.juri) ch=.5+(ch-.5)*.8;
  return {skill,items,ch:clamp(ch,.05,.95)};
}

async function fimSemanaJuiz(){
  if(ocupado) return; ocupado=true;
  try{
    autoDistribuir();
    const J=S.j, C=CARGOS[J.cargo], gab=gabinete();
    const tot=J.acervo.reduce((a,p)=>a+(p.semana||0),0);
    const pessoal=Math.max(0,tot-gab)+S.agenda.estudo+acadBlocos(), desc=Math.max(0,S.disp-pessoal-S.agenda.lazer-vidaBlocos());
    if(S.agenda.estudo){ const k=S.agenda.estudoSkill, mult=(S.traits.includes('rato')?1.5:1)*(tem('pesquisa',3)?1.5:1);
      for(let i=0;i<S.agenda.estudo;i++) S.skills[k]=clamp(S.skills[k]+1.1*mult*(1-S.skills[k]/110),0,100);
      S.estudoTotal=(S.estudoTotal||0)+S.agenda.estudo; }
    S.energia=clamp(S.energia-3.2*pessoal*(S.traits.includes('workaholic')?.7:1)+3*desc+1.5*S.agenda.lazer,0,100);
    S.estresse=clamp(S.estresse+2.2*pessoal*(S.traits.includes('ansioso')?1.25:1)-1.2*desc-6*S.agenda.lazer,0,100);
    S.caixa+=C.salario-CUSTO_VIDA_JUIZ;
    // sentenças
    const sent=[], dec=[];
    const pauta=J.acervo.filter(p=>(p.semana||0)>0);
    J.acervo=J.acervo.filter(p=>!((p.semana||0)>0));
    for(const p of pauta){
      if(RORD.indexOf(p.rar)>=2 && Math.random()<.35) await eventoJuiz(p);
      if(p.adiado){ p.adiado=false; p.semana=0; J.acervo.push(p); sent.push([p,null,'Nova perícia: volta ao acervo']); continue; }
      const ch=calcAcerto(p).ch, ap=chanceRecursoJ(p), rec=Math.random()<ap;
      J.sentencas++; xpJuiz(p,1);
      if(rec){ J.recursos.push({titulo:p.titulo,rar:p.rar,ch,semanas:rint(3,6),inst:J.cargo>=3?'STF':J.cargo>=2?supNome():'Tribunal'}); sent.push([p,ch,'Recorrida: vai ao tribunal']); }
      else { const g=RAR[p.rar].ganho/2; S.prest=clamp(S.prest+g,0,100); J.transitadas++; sent.push([p,ch,`Transitou em julgado · ${sgn(g)}`]); }
    }
    if(sent.length) addLog(`${sent.length} sentença(s) proferida(s).`);
    // tribunal julga os recursos
    for(const r of J.recursos) r.semanas--;
    for(const r of J.recursos.filter(r=>r.semanas<=0)){
      const ok=Math.random()<r.ch, R=RAR[r.rar];
      if(ok){ J.mantidas++; S.prest=clamp(S.prest+R.ganho,0,100); xpJuiz({area:'escrita',rar:r.rar},0); }
      else { J.reformas++; S.prest=clamp(S.prest-R.perda,0,100); S.estresse=clamp(S.estresse+4,0,100); }
      dec.push([r,ok]); addLog(`${r.inst} ${ok?'manteve':'reformou'} sua sentença em “${r.titulo}”. ${sgn(ok?R.ganho:-R.perda)} reputação.`,ok?'g':'r');
    }
    J.recursos=J.recursos.filter(r=>r.semanas>0);
    // acervo envelhece e chegam processos novos
    let atras=0; for(const p of J.acervo){ p.idade++; p.semana=0; if(p.idade>p.meta) atras++; }
    if(atras){ S.prest=clamp(S.prest-.3*atras*fatorAtraso(),0,100); S.estresse=clamp(S.estresse+.5*atras,0,100); }
    const novos=novosPorSemana(J.comarca); for(let i=0;i<novos;i++) J.acervo.push(novoProcesso());
    const est=semanaEstruturaPub(novos);
    // resumo
    await modal(`<span class="label">Semana ${S.semana} · ${nomeCargo(J.cargo)} · ${CIDADES[J.comarca].nome}</span><h2>Balanço do gabinete</h2>
      <span class="label">Sentenças (${sent.length})</span>
      ${sent.length?`<ul class="break">${sent.map(([p,ch,t])=>`<li><span>${esc(p.titulo)}${ch!==null?` · ${pct(ch)} de acerto`:''}</span><span class="num">${t}</span></li>`).join('')}</ul>`:'<p style="font-size:12.5px;color:var(--muted)">Nenhuma sentença nesta semana.</p>'}
      ${dec.length?`<span class="label">Decisões do tribunal</span><ul class="break">${dec.map(([r,ok])=>`<li><span>${esc(r.titulo)}</span><span class="num ${ok?'hi':'lo'}">${ok?'Mantida '+sgn(RAR[r.rar].ganho):'Reformada '+sgn(-RAR[r.rar].perda)}</span></li>`).join('')}</ul>`:''}
      ${`<ul class="break">${est.map(n=>`<li><span>${n}</span></li>`).join('')}</ul>`}
      <dl class="meta"><dt>Processos atrasados</dt><dd class="num ${atras?'lo':''}">${atras}${atras?` · ${sgn(-.3*atras)} reputação`:''}</dd>
        <dt>Processos novos</dt><dd class="num">${novos}</dd><dt>Salário menos custo de vida</dt><dd class="num hi">${brl(C.salario-CUSTO_VIDA_JUIZ)}</dd></dl>`,[{t:'Continuar',v:1,cls:'brass'}]);
    // corregedoria
    if(J.propina && Math.random()<.2*J.propina){ S.fim='cassado'; }
    await semanaAcademia(); if(await semanaVida()) return;
    S.semana++; S.agenda.estudo=0; S.agenda.lazer=0; S.disp=BLOCOS-blocosPerdidos();
    if(S.estresse>=100){ S.disp=10; S.estresse=70; addLog('Burnout: você só terá 10 blocos na próxima semana.','r'); }
    else if(S.energia<=0){ S.disp=14; addLog('Exaustão: você só terá 14 blocos na próxima semana.','r'); }
    if(!S.fim && S.prest<=0) S.fim='cnj';
    if(!S.fim && promoOk() && !J.avisoPromo){ J.avisoPromo=true; addLog(`Você já pode pedir promoção a ${nomeCargo(J.cargo+1)}.`,'g'); }
    salvar(); render();
    if(S.fim){
      const txt=S.fim==='cassado'?'A corregedoria descobriu a propina. Você perdeu o cargo e responde a processo criminal.':'Sua reputação chegou a zero e o Conselho Nacional de Justiça afastou você do cargo.';
      await modal(`<h2 class="lo">Carreira encerrada</h2><p>${txt} Foram ${J.sentencas} sentenças em ${S.semana-1} semanas.</p>`,[{t:'Nova carreira',v:1,cls:'brass'}]);
      hallRegistrar(S.fim==='falencia'?'falencia':'encerrada'); S=null; apagarSave();
    }
  } finally { ocupado=false; render(); }
}

async function promocao(){
  if(ocupado||!promoOk()) return; const J=S.j, prox=J.cargo+1, N=CARGOS[prox];

  const titulo=prox===4?'Indicação ao Supremo Tribunal Federal':prox===3?`Posse no ${supNome()==='TST'?'Tribunal Superior do Trabalho':'Superior Tribunal de Justiça'}`:prox===2?(vara()==='trabalho'?'Escolha o Tribunal Regional do Trabalho':vara()==='tributario'?'Escolha o Tribunal Regional Federal':'Escolha o Tribunal de Justiça'):'Escolha a comarca';
  const v=await modal(`<h2>${titulo}</h2><p>Como ${nomeCargo(prox)}: orçamento base de ${brl(ORC_BASE[prox])} por semana para a unidade e salário de ${brl(N.salario)}. A equipe e a estrutura vão com você. O acervo atual fica com o seu sucessor.</p>
    <div class="opts">${ops.map(k=>`<button class="opt" data-mv="${k}"><span>${prox>=3?'Brasília · '+(prox===4?'STF':supNome()):CIDADES[k].nome}${k===J.comarca?' (atual)':''}</span><b class="num">${novosPorSemana(k)}/sem</b><small>Tamanho ${'●'.repeat(CIDADES[k].pop)}${'○'.repeat(5-CIDADES[k].pop)} · processos novos por semana</small></button>`).join('')}</div>`,
    [{t:'Cancelar',v:'',cls:'ghost'}]);
  if(!v) return;
  if(prox===4){
    const ch=clamp(.4+(S.integ-60)/100+(S.prest-95)/20,.1,.9); let ok;
    ocupado=true;
    try{ ok=await rolar('Sabatina no Senado',`O Presidente indicou você ao STF. Agora o Senado precisa aprovar. Integridade ${Math.round(S.integ)} pesa na votação.`,ch,'Aprovado','Rejeitado'); }

  }
  if(v!==J.comarca && !(await mudancaVida(CIDADES[v].nome))) return;
  J.cargo=prox; J.comarca=v; J.avisoPromo=false; J.acervo=[]; for(let i=0;i<6;i++) J.acervo.push(novoProcesso());

}

function fasesConcurso(tipo){ const b=Math.min(15,(S.estudoTotal||0)*.5)+bonusTitulos()+Math.min(5,((S.formacao&&S.formacao.contatos[tipo])||0)/10);
  const areas=Object.keys(AREAS).reduce((a,k)=>a+S.skills[k],0)/Object.keys(AREAS).length;
  const f=(n,sk,d)=>({n,sk:Math.round(sk),d,ch:clamp(sig((sk+b-d)/8),.05,.95)});
  return {b,fs:[f('Prova objetiva',areas,32),f('Prova discursiva',S.skills.escrita,38),f('Prova oral',(S.skills.oratoria+S.skills.analise)/2,38)]}; }
async function concurso(tipo='juiz'){
  if(ocupado) return; const MP=tipo==='promotor', {b,fs}=fasesConcurso(tipo);
  const NOME_CONC={juiz:'Concurso da magistratura',promotor:'Concurso do Ministério Público',defensor:'Concurso da Defensoria Pública'}, POSSE={juiz:'Juiz Substituto',promotor:'Promotor Substituto',defensor:'Defensor Público Substituto'};
  const v=await modal(`<h2>${NOME_CONC[tipo]}</h2><p>Três fases eliminatórias. Cada bloco de estudo acumulado vale +0,5 nas provas (máximo +15). Seu bônus atual: <b class="num">+${b.toLocaleString('pt-BR')}</b>.</p>
    <dl class="meta">${fs.map(x=>`<dt>${x.n} · skill ${x.sk} vs ${x.d}</dt><dd class="num ${cls(x.ch)}">${pct(x.ch)}</dd>`).join('')}
      <dt>Aprovação nas três</dt><dd class="num">${pct(fs.reduce((a,x)=>a*x.ch,1))}</dd><dt>Inscrição</dt><dd class="num">${brl(3000)}</dd></dl>`,
    [{t:'Agora não',v:0,cls:'ghost'},{t:'Fazer as provas',v:1,cls:'brass'}]);
  if(!v) return; ocupado=true;
  try{
    S.caixa-=3000;

function calcCondenacao(c){
  const items=[]; const add=(l,v)=>{ if(v) items.push([l,v]); };
  const skill=.5*S.skills[c.area]+.3*S.skills.analise+.2*S.skills.oratoria;
  const n=c.prep+(c.semana||0); add(`Diligências e preparo (${n} bloco${n===1?'':'s'})`,prepBonus(n));
  if(c.revelado) add('Indícios de inocência',-25);
  if(S.p.cargo>=2) add('Experiência no tribunal',3);
  if(S.energia<30) add('Cansaço',-10);
  if(S.estresse>70) add('Estresse alto',-8);
  if(S.traits.includes('orador') && c.juri) add('Orador nato (júri)',5);
  if(S.traits.includes('ansioso') && RORD.indexOf(c.rar)>=3) add('Ansiedade',-5);
  if(S.traits.includes('sortudo')) add('Sortudo',3);
  if(c.inst>1){ add(INST[c.inst],-10*(c.inst-1)); add(c.lado==='recorrido'?'Condenação já obtida':'Absolvição anterior',c.lado==='recorrido'?10:-10); }
  bonusPerks(c,add); add('Audiência',c.mod);
  const bonus=items.reduce((a,x)=>a+x[1],0);
  let ch=sig((skill+bonus-c.d)/12); if(c.juri) ch=.5+(ch-.5)*.8;
  return {skill,items,ch:clamp(ch,.05,.95)};
}

async function julgamentoMP(c){

  await modal(`<span class="label">Julgamento · ${esc(c.titulo)}</span><h2>${c.juri?'O júri vai decidir':'O juiz vai decidir'}</h2>
    <p class="num">Chance de condenação: <b class="${cls(ch)}">${pct(ch)}</b></p>

    <div class="verdict ${cond?'hi':'lo'}" hidden>${cond?'Condenado':'Absolvido'}</div>
    <div class="res" hidden>${linhas.join('<br>')}</div>`,[{t:'Continuar',v:1,dis:true}],async box=>{

async function fimSemanaMP(){

    const tot=P.casos.reduce((a,c)=>a+(c.semana||0),0);
    const pessoal=Math.max(0,tot-gab)+S.agenda.estudo+acadBlocos(), desc=Math.max(0,S.disp-pessoal-S.agenda.lazer-vidaBlocos());
    if(S.agenda.estudo){ const k=S.agenda.estudoSkill, mult=(S.traits.includes('rato')?1.5:1)*(tem('pesquisa',3)?1.5:1);
      for(let i=0;i<S.agenda.estudo;i++) S.skills[k]=clamp(S.skills[k]+1.1*mult*(1-S.skills[k]/110),0,100);
      S.estudoTotal=(S.estudoTotal||0)+S.agenda.estudo; }
    S.energia=clamp(S.energia-3.2*pessoal*(S.traits.includes('workaholic')?.7:1)+3*desc+1.5*S.agenda.lazer,0,100);
    S.estresse=clamp(S.estresse+2.2*pessoal*(S.traits.includes('ansioso')?1.25:1)-1.2*desc-6*S.agenda.lazer,0,100);
    S.caixa+=C.salario-CUSTO_VIDA_JUIZ;
    const notas=[];
    // diligências e preparo
    for(const c of P.casos){ const n=c.semana||0;
      if(n && c.fase==='inq' && c.inocente && !c.revelado){ for(let i=0;i<n;i++) if(Math.random()<(tem('analise',2)?.35:.2)){ c.revelado=true; break; }

      c.prep+=n; c.semana=0; }
    // audiências
    for(const c of P.casos) if(c.fase==='juizo') c.prazo--;
    const hoje=P.casos.filter(c=>c.fase==='juizo'&&c.prazo<=0);
    P.casos=P.casos.filter(c=>!(c.fase==='juizo'&&c.prazo<=0));
    for(const c of hoje) await julgamentoMP(c);
    // recursos
    for(const r of P.recursos) r.semanas--;

      const ok=Math.random()<r.ch, R=RAR[r.rar]; let d;
      if(r.tipo==='defesa'){ d=ok?R.ganho/2:-R.perda/2; if(!ok){ P.condenacoes--; P.absolvicoes++; } }
      else { d=ok?R.ganho:-R.perda/2; if(ok){ P.condenacoes++; P.absolvicoes--; } }
      S.prest=clamp(S.prest+d,0,100);
      const txt=r.tipo==='defesa'?(ok?'Tribunal manteve a condenação':'Tribunal absolveu o réu'):(ok?'Tribunal condenou o réu':'Tribunal manteve a absolvição');
      notas.push(`${txt} em “${r.titulo}”: ${sgn(d)} reputação.`); addLog(`${txt} em “${r.titulo}”. ${sgn(d)} reputação.`,d>=0?'g':'r');
    }
    P.recursos=P.recursos.filter(r=>r.semanas>0);

    for(const e of [...P.erros]) if(Math.random()<.12){
      P.erros=P.erros.filter(x=>x!==e); const d=-2*RAR[e.rar].perda;
      S.prest=clamp(S.prest+d,0,100); S.integ=clamp(S.integ-15,0,100);
      notas.push(`<b class="lo">Erro judiciário:</b> provas novas mostram que o condenado em “${esc(e.titulo)}” era inocente. ${sgn(d)} reputação e −15 de integridade.`);
      addLog(`Erro judiciário em “${e.titulo}”. ${sgn(d)} reputação.`,'r');
    }
    // inquéritos envelhecem e prescrevem
    let atras=0;
    for(const c of P.casos) if(c.fase==='inq'){ c.idade++; if(c.idade>c.meta) atras++; }
    for(const c of P.casos.filter(c=>c.fase==='inq'&&c.idade>c.meta+6)){
      const d=-RAR[c.rar].perda; S.prest=clamp(S.prest+d,0,100);
      notas.push(`O crime prescreveu em “${esc(c.titulo)}”: ${sgn(d)} reputação.`); addLog(`Prescrição em “${c.titulo}”. ${sgn(d)} reputação.`,'r'); }
    P.casos=P.casos.filter(c=>!(c.fase==='inq'&&c.idade>c.meta+6));

    const novos=novosInq(P.comarca); for(let i=0;i<novos;i++) P.casos.push(novoInquerito());
    const est=semanaEstruturaPub(novos);
    await modal(`<span class="label">Semana ${S.semana} · ${fem(C.nome)} · ${CIDADES[P.comarca].nome}</span><h2>Balanço da promotoria</h2>
      ${notas.length?`<ul class="break">${notas.map(n=>`<li><span>${n}</span></li>`).join('')}</ul>`:'<p style="font-size:12.5px;color:var(--muted)">Semana sem novidades nos processos.</p>'}
      ${`<ul class="break">${est.map(n=>`<li><span>${n}</span></li>`).join('')}</ul>`}
      <dl class="meta"><dt>Inquéritos atrasados</dt><dd class="num ${atras?'lo':''}">${atras}${atras?` · ${sgn(-.3*atras)} reputação`:''}</dd>
        <dt>Inquéritos novos</dt><dd class="num">${novos}</dd><dt>Salário menos custo de vida</dt><dd class="num hi">${brl(C.salario-CUSTO_VIDA_JUIZ)}</dd></dl>`,[{t:'Continuar',v:1,cls:'brass'}]);
    await semanaAcademia(); if(await semanaVida()) return;
    S.semana++; S.agenda.estudo=0; S.agenda.lazer=0; S.disp=BLOCOS-blocosPerdidos();
    if(S.estresse>=100){ S.disp=10; S.estresse=70; addLog('Burnout: você só terá 10 blocos na próxima semana.','r'); }
    else if(S.energia<=0){ S.disp=14; addLog('Exaustão: você só terá 14 blocos na próxima semana.','r'); }
    if(S.prest<=0) S.fim='cnmp';
    if(!S.fim && promoOkMP() && !P.avisoPromo){ P.avisoPromo=true; addLog(`Você já pode pedir promoção a ${fem(CARGOS_MP[P.cargo+1].nome)}.`,'g'); }

      hallRegistrar(S.fim==='falencia'?'falencia':'encerrada'); S=null; apagarSave();
    }

}

function filaPrioridade(){
  if(S.carreira==='juiz') return [...S.j.acervo].sort((a,b)=>(b.idade-b.meta)-(a.idade-a.meta));
  if(S.carreira==='promotor') return [...S.p.casos].sort((a,b)=>(a.fase==='juizo'?a.prazo:99)-(b.fase==='juizo'?b.prazo:99)||(b.idade-a.idade));
  if(S.carreira==='defensor') return [...S.d.casos].sort((a,b)=>(a.prazo-b.prazo)||(b.preso-a.preso));

function autoDistribuir(){ const U=S.u, g=gestorAtual(); if(!U.auto||!g) return 0;

  const lista=filaPrioridade(); if(!lista.length) return 0;
  if(Math.random()*100>g.g) lista.sort(()=>Math.random()-.5);
  let n=0; while(livre>0){ const c=lista[n%lista.length]; c.semana=(c.semana||0)+1; livre--; n++; }
  addLog(`${g.nome} (${nomeGestor().toLowerCase()}) distribuiu ${n} bloco(s) da equipe pelos casos mais urgentes.`);

function semanaEquipe(){ const U=S.u, linhas=[], carga=pendentes()/(trabalhadores().length+1), semGestor=U.equipe.length>4&&!gestorAtual();
  if(temSala('copa')) S.estresse=clamp(S.estresse-3,0,100);
  for(const f of U.equipe){ f.semanas++;
    let dm=(60-f.moral)*.1+(temSala('copa')?3:0)-Math.max(0,carga-6)*.8-(semGestor?2:0);
    if(f.salBase) dm+=(f.sal/f.salBase-1)*20;
    f.moral=clamp(f.moral+dm+rnd(-2,2),0,100); f.q=clamp(f.q+.15,0,95); }
  for(const f of [...U.equipe]) if(f.moral<25&&f.funcao!=='socio'&&Math.random()<.35){
    removeFunc(f.id);
    const t=`${f.nome} (${nomeFuncao(f)}) ${pubCar()?'pediu remoção para outra unidade':'pediu demissão'} por moral baixa.`;
    linhas.push(t); addLog(t,'r');

  const ret=Math.min(U.retirada,Math.max(0,S.caixa)); S.caixa-=ret; S.bolso+=ret-CUSTO_VIDA;
  U.hist.unshift({w:S.semana,hon:U.honSemana,desp:d.total,dist,ret}); U.hist=U.hist.slice(0,6);
  addLog(`Escritório: ${brl(U.honSemana)} de honorários, ${brl(d.total)} de despesas${dist?`, ${brl(dist)} aos sócios`:''} e retirada de ${brl(ret)}.`);

async function contratar(funcao){

    return modal(`<h2>Lotação completa</h2><p>O tribunal só cede ${1+cargoAtual()} servidor(es) efetivo(s) para este cargo. Promoções aumentam a lotação.</p>`,[{t:'Ok',v:1}]);
  const cands=[gerarCandidato(funcao),gerarCandidato(funcao),gerarCandidato(funcao)];
  const origem=funcao==='servidor'?'Servidores disponíveis para requisição (pagos pelo tribunal)':pubCar()?'Salário pago pelo orçamento da unidade':'Salário pago pelo caixa do escritório';
  const v=await modal(`<h2>${funcao==='servidor'?'Requisitar':'Contratar'}: ${funcao==='gestor'?nomeGestor():F.nome}</h2><p>${origem}. ${F.bl?`Rende cerca de ${F.bl} blocos por semana, conforme a moral.`:'Não atende casos, mas melhora a organização.'}</p>
    <div class="opts">${cands.map((c,i)=>`<button class="opt" data-mv="${i}"><span>${esc(c.nome)}</span><b class="num">${F.sal?brl(c.sal)+'/sem':'sem custo'}</b><small>Qualidade ${c.q}${F.g?` · gestão ${c.g}`:''} · moral ${c.moral}</small></button>`).join('')}</div>`,[{t:'Cancelar',v:'',cls:'ghost'}]);
  if(v===''||v===undefined) return;
  const c=cands[+v]; U.equipe.push(c); if(funcao==='gestor'&&!U.gestorId) U.gestorId=c.id;

function promoverF(id){ const U=S.u, f=U.equipe.find(x=>x.id===id), prox=PROMO_ADV[f&&f.funcao]; if(!f||!prox||f.semanas<f.promoEm) return;

function construir(tipo){ const U=S.u, i=U.sel, C=COMODOS[tipo], pub=pubCar(); if(i===null||U.salas[i]) return;

  if(k==='reuniao'){ s+=R(32,44,86,28,12); for(let m=0;m<3;m++){ s+=cad(50+m*25,36)+cad(50+m*25,80); } s+=cad(24,58)+cad(126,58)+L(142,36,142,80,'bp-tv')+O(75,58,6,'fd'); }
  if(k==='biblioteca'){ for(let m=0;m<3;m++){ s+=R(10+m*44,34,38,11,1); for(let l=1;l<6;l++) s+=L(10+m*44+l*6.3,34,10+m*44+l*6.3,45); } s+=R(48,64,54,24,4)+cad(40,76)+cad(110,76)+O(75,76,4,'fd'); }
  if(k==='arquivo'){ for(let m=0;m<4;m++){ s+=R(10+m*25,34,21,30,1); for(let l=1;l<4;l++) s+=L(12+m*25,34+l*7.5,29+m*25,34+l*7.5); } s+=R(116,34,24,58,2); for(let l=0;l<6;l++) s+=O(128,41+l*8.5,1.6,'bp-led'); s+=L(10,80,104,80,'fd'); }
  if(k==='copa'){ s+=R(10,34,130,14,1)+O(32,41,5)+O(108,41,3.5)+O(120,41,3.5)+O(75,78,14)+cad(53,78)+cad(97,78)+cad(75,99)+vaso(136,96); }

function plantaSVG(){ const U=S.u, im=imovelAtual(), w=im.cols*CW, h=im.rows*CH, W=w+MX+MR, H=h+MY+MB;
  const trabalhando=[...U.equipe].sort((a,b)=>(b.id===U.gestorId)-(a.id===U.gestorId)); let idx=0;
  let s=`<defs>
    <pattern id="bpMin" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" class="bp-g1"/></pattern>
    <pattern id="bpMaj" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#bpMin)"/><path d="M50 0H0V50" class="bp-g2"/></pattern>
    <radialGradient id="bpVig" cx="50%" cy="45%" r="75%"><stop offset="60%" stop-color="#0B2F5C" stop-opacity="0"/><stop offset="100%" stop-color="#0B2F5C" stop-opacity=".55"/></radialGradient>
    <filter id="bpGlow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="${W}" height="${H}" class="bp-bg"/><rect width="${W}" height="${H}" fill="url(#bpMaj)"/><rect width="${W}" height="${H}" fill="url(#bpVig)"/>
  <rect x="10" y="10" width="${W-20}" height="${H-20}" class="bp-frame"/><rect x="14" y="14" width="${W-28}" height="${H-28}" class="bp-frame fino"/>`;
  const ox=MX, oy=MY; let paredes='', vaos='', portas='', janelas='', topo='';
  U.salas.forEach((k,i)=>{ const col=i%im.cols, row=Math.floor(i/im.cols), x=ox+col*CW, y=oy+row*CH;
    let quem=[]; if(k&&COMODOS[k].mesas){ quem=trabalhando.slice(idx,idx+COMODOS[k].mesas); idx+=COMODOS[k].mesas; }
    s+=`<g class="slot ${U.sel===i?'sel':''}" data-act="slot" data-v="${i}" role="button" tabindex="0" aria-label="${k?COMODOS[k].nome:'Espaço vazio'}">`;
    if(!k) s+=`<rect x="${x+12}" y="${y+12}" width="${CW-24}" height="${CH-24}" rx="3" class="bp-empty"/><line x1="${x+12}" y1="${y+12}" x2="${x+CW-12}" y2="${y+CH-12}" class="bp-empty x"/><line x1="${x+CW-12}" y1="${y+12}" x2="${x+12}" y2="${y+CH-12}" class="bp-empty x"/><rect x="${x+CW/2-44}" y="${y+CH/2-9}" width="88" height="18" class="bp-chip"/><text x="${x+CW/2}" y="${y+CH/2+3.5}" text-anchor="middle" class="bp-empty-t">+ CONSTRUIR</text>`;
    else s+=`<rect x="${x}" y="${y}" width="${CW}" height="${CH}" class="bp-floor"/>${moveis(k,x,y,quem)}<text x="${x+9}" y="${y+16}" class="bp-t">${COMODOS[k].nome.toUpperCase()}</text><text x="${x+9}" y="${y+26}" class="bp-a">${m2(CW,CH)} m²</text>`;
    s+=`<rect x="${x+3}" y="${y+3}" width="${CW-6}" height="${CH-6}" class="bp-hit"/></g>`;
    paredes+=`<rect x="${x}" y="${y}" width="${CW}" height="${CH}" class="bp-wall"/>`;
    if(k){ // porta: parede esquerda (interna) ou de baixo
      if(col>0){ vaos+=`<rect x="${x-3}" y="${y+CH-36}" width="6" height="24" class="bp-gap"/>`; portas+=`<line x1="${x}" y1="${y+CH-12}" x2="${x+24}" y2="${y+CH-12}" class="fl"/><path d="M${x+24} ${y+CH-12} A24 24 0 0 0 ${x} ${y+CH-36}" class="fd"/>`; }
      else if(row<im.rows-1){ vaos+=`<rect x="${x+CW-36}" y="${y+CH-3}" width="24" height="6" class="bp-gap"/>`; portas+=`<line x1="${x+CW-12}" y1="${y+CH}" x2="${x+CW-12}" y2="${y+CH-24}" class="fl"/><path d="M${x+CW-12} ${y+CH-24} A24 24 0 0 0 ${x+CW-36} ${y+CH}" class="fd"/>`; }
      else { vaos+=`<rect x="${x+CW-44}" y="${y+CH-5}" width="32" height="10" class="bp-gap"/>`; portas+=`<line x1="${x+CW-12}" y1="${y+CH}" x2="${x+CW-12}" y2="${y+CH-32}" class="fl"/><path d="M${x+CW-12} ${y+CH-32} A32 32 0 0 0 ${x+CW-44} ${y+CH}" class="fd"/><text x="${x+CW-28}" y="${y+CH+20}" text-anchor="middle" class="bp-dimt">ENTRADA</text>`; } }
    if(row===0){ janelas+=`<rect x="${x+CW/2-22}" y="${y-5}" width="44" height="10" class="bp-gap"/><line x1="${x+CW/2-22}" y1="${y-2}" x2="${x+CW/2+22}" y2="${y-2}" class="fl"/><line x1="${x+CW/2-22}" y1="${y+2}" x2="${x+CW/2+22}" y2="${y+2}" class="fl"/><line x1="${x+CW/2-22}" y1="${y-5}" x2="${x+CW/2-22}" y2="${y+5}" class="fl"/><line x1="${x+CW/2+22}" y1="${y-5}" x2="${x+CW/2+22}" y2="${y+5}" class="fl"/>`;
      topo+=`<line x1="${x}" y1="${oy-30}" x2="${x+CW}" y2="${oy-30}" class="bp-dim"/><line x1="${x-4}" y1="${oy-26}" x2="${x+4}" y2="${oy-34}" class="bp-dim"/><line x1="${x+CW-4}" y1="${oy-26}" x2="${x+CW+4}" y2="${oy-34}" class="bp-dim"/><line x1="${x}" y1="${oy-38}" x2="${x}" y2="${oy-8}" class="bp-dim fino"/><text x="${x+CW/2}" y="${oy-35}" text-anchor="middle" class="bp-dimt">${metro(CW)}</text>`; }
    if(col===im.cols-1) janelas+=`<rect x="${x+CW-5}" y="${y+CH/2-18}" width="10" height="36" class="bp-gap"/><line x1="${x+CW-2}" y1="${y+CH/2-18}" x2="${x+CW-2}" y2="${y+CH/2+18}" class="fl"/><line x1="${x+CW+2}" y1="${y+CH/2-18}" x2="${x+CW+2}" y2="${y+CH/2+18}" class="fl"/>`;
    if(col===0) topo+=`<line x1="${ox-32}" y1="${y}" x2="${ox-32}" y2="${y+CH}" class="bp-dim"/><line x1="${ox-36}" y1="${y+4}" x2="${ox-28}" y2="${y-4}" class="bp-dim"/><line x1="${ox-36}" y1="${y+CH+4}" x2="${ox-28}" y2="${y+CH-4}" class="bp-dim"/><line x1="${ox-40}" y1="${y}" x2="${ox-8}" y2="${y}" class="bp-dim fino"/><text x="${ox-38}" y="${y+CH/2}" text-anchor="middle" transform="rotate(-90 ${ox-38} ${y+CH/2})" class="bp-dimt">${metro(CH)}</text>`; });
  topo+=`<line x1="${ox+w}" y1="${oy-38}" x2="${ox+w}" y2="${oy-8}" class="bp-dim fino"/><line x1="${ox-40}" y1="${oy+h}" x2="${ox-8}" y2="${oy+h}" class="bp-dim fino"/>`;
  // cota total embaixo
  const yb=oy+h+44; topo+=`<line x1="${ox}" y1="${yb}" x2="${ox+w}" y2="${yb}" class="bp-dim"/><line x1="${ox-4}" y1="${yb+4}" x2="${ox+4}" y2="${yb-4}" class="bp-dim"/><line x1="${ox+w-4}" y1="${yb+4}" x2="${ox+w+4}" y2="${yb-4}" class="bp-dim"/><text x="${ox+w/2}" y="${yb-5}" text-anchor="middle" class="bp-dimt">${metro(w)} m · área total ${m2(w,h)} m²</text>`;
  s+=paredes+`<rect x="${ox}" y="${oy}" width="${w}" height="${h}" class="bp-wall-ext"/><rect x="${ox}" y="${oy}" width="${w}" height="${h}" class="bp-wall-oco"/>`+vaos+janelas+portas+topo;
  // rosa dos ventos e escala
  const nx=ox+18, ny=H-48;
  s+=`<g class="bp-norte"><circle cx="${nx}" cy="${ny}" r="15" class="fl"/><path d="M${nx} ${ny-13} L${nx+5} ${ny+6} L${nx} ${ny+2} L${nx-5} ${ny+6}Z" class="bp-seta"/><text x="${nx}" y="${ny-19}" text-anchor="middle" class="bp-dimt">N</text></g>`;
  const sx=ox+50, sy=H-40; for(let m=0;m<4;m++) s+=`<rect x="${sx+m/M_PX}" y="${sy}" width="${1/M_PX}" height="5" class="${m%2?'bp-esc-b':'bp-esc-a'}"/><text x="${sx+m/M_PX}" y="${sy-4}" text-anchor="middle" class="bp-a">${m}</text>`;
  s+=`<text x="${sx+4/M_PX}" y="${sy-4}" text-anchor="middle" class="bp-a">4 m</text>`;
  // carimbo
  const cw=Math.min(300,W-MR+20-(sx+4/M_PX)-24), cx0=W-MR-cw+20, cy0=H-MB+66, ch=46, dv=cx0+cw-72;
  s+=`<g class="bp-carimbo"><rect x="${cx0}" y="${cy0}" width="${cw}" height="${ch}" class="bp-frame"/><line x1="${cx0}" y1="${cy0+18}" x2="${cx0+cw}" y2="${cy0+18}" class="bp-frame"/><line x1="${dv}" y1="${cy0+18}" x2="${dv}" y2="${cy0+ch}" class="bp-frame"/>
    <text x="${cx0+8}" y="${cy0+12.5}" class="bp-t">PLANTA BAIXA · ${im.nome.toUpperCase()}</text>
    <text x="${cx0+8}" y="${cy0+30}" class="bp-a">TITULAR: ${esc(S.nome).toUpperCase()}</text><text x="${cx0+8}" y="${cy0+40}" class="bp-a">${U.equipe.length} NA EQUIPE · ORG. ${organizacao()}</text>
    <text x="${dv+8}" y="${cy0+30}" class="bp-a">ESC. 1:100</text><text x="${dv+8}" y="${cy0+40}" class="bp-a">SEMANA ${String(S.semana).padStart(2,'0')}</text></g>`;
  return {s,W,H}; }

const ANO=10; // semanas de jogo por ano de vida: a vida corre mais rápido que a agenda
const CARROS=[{nome:'Sem carro (transporte público)',preco:0,fel:0,prest:0},{nome:'Carro popular',preco:60000,fel:.5,prest:0},{nome:'Sedã executivo',preco:150000,fel:1,prest:1},{nome:'SUV de luxo',preco:400000,fel:1.5,prest:2},{nome:'Esportivo importado',preco:1200000,fel:2.5,prest:4}];
const manutCarro=()=>Math.round(CARROS[S.vida.carro||0].preco*.0015/10)*10;
const MORADIAS=[{nome:'Apartamento alugado',preco:0,fel:0},{nome:'Apartamento próprio',preco:250000,fel:1},{nome:'Casa com quintal',preco:900000,fel:2},{nome:'Cobertura',preco:3000000,fel:3}];
const AREAS_PROF=['medicina','engenharia','ensino','arquitetura','jornalismo','negócios próprios','serviço público','advocacia','tecnologia','artes'];
function vidaInicial(idade0=25){ return {idade0,semana0:S?S.semana:1,saude:85,felicidade:60,parceiro:null,filhos:[],moradia:0,carro:0,inv:invInicial(),alugueis:[],gravidez:null,doente:0,falta:0,geracao:1,legado:[],ultimoAniv:idade0}; }
const idade=()=>Math.floor(S.vida.idade0+(S.semana-S.vida.semana0)/ANO);
const idadeFilho=f=>Math.floor((S.semana-f.nasc)/ANO);
const vidaBlocos=()=>(S.agenda.familia||0)+(S.agenda.saude||0);
const sobrenome=()=>S.nome.trim().split(' ').slice(-1)[0];
const dinheiroPessoal=()=>S.carreira==='adv'?S.bolso:S.caixa;
function pagarPessoal(v){ if(S.carreira==='adv') S.bolso-=v; else S.caixa-=v; }
function patrimonio(){ return Math.round((S.carreira==='adv'?S.caixa+S.bolso:S.caixa)+MORADIAS[S.vida.moradia].preco+CARROS[S.vida.carro||0].preco*.7-saldoDivida()+totalInvest()+totalAlugueis()); }
function blocosPerdidos(){ const V=S.vida; if(!V) return 0; const n=(V.doente>0?7:0)+(V.falta||0)-((V.carro||0)>0?1:0); V.falta=0; return n; }
function bonusVida(add){ const V=S.vida; if(!V) return;
  if(V.parceiro&&V.parceiro.pers==='juridico'&&V.parceiro.rel>=50) add('Conselhos de casa (parceiro da área jurídica)',2);
  if(V.felicidade>80) add('Felicidade',3); if(V.felicidade<25) add('Infelicidade',-3); if(V.saude<40) add('Saúde frágil',-4); }
const temFamilia=()=>!!S.vida.parceiro||S.vida.filhos.length>0;
function rowsVida(free){
  return `<div class="row"><span class="name">${temFamilia()?'Família':'Vida social (conhecer pessoas)'}</span>${stepper('familia',0,S.agenda.familia||0,free)}</div>
          <div class="row"><span class="name">Academia e saúde</span>${stepper('saude',0,S.agenda.saude||0,free)}</div>`; }
function descCarreira(){ if(S.carreira==='academico') return nomeAcad(); if(S.carreira==='estudante') return 'Estudante de Direito'; return S.carreira==='juiz'?nomeCargo(S.j.cargo):S.carreira==='promotor'?fem(CARGOS_MP[S.p.cargo].nome):S.carreira==='defensor'?fem(CARGOS_DP[S.d.cargo].nome):(S.ex?'Advocacia (ex-'+S.ex.cargo.toLowerCase()+')':'Advocacia'); }
function resumoCarreira(){ if(S.carreira==='academico'||S.carreira==='estudante') return `${S.ac.pubs.length} publicações, índice ${S.ac.indice}`; return S.carreira==='juiz'?`${S.j.sentencas} sentenças, ${pct(taxaReforma())} reformadas`:S.carreira==='promotor'?`${S.p.condenacoes} condenações`:S.carreira==='defensor'?`${S.d.atendimentos} atendimentos, ${S.d.cartas} cartas de agradecimento`:`${S.vitorias} vitórias e ${S.derrotas} derrotas`; }

async function mudancaVida(cidade){
  const P=S.vida.parceiro; if(!P) return true;
  const ch=clamp(P.rel/100+.15+((PERS_PARC[P.pers]||{}).mudar||0),.05,.95), aceita=Math.random()<ch;
  if(aceita){ P.rel=clamp(P.rel-5,0,100); addLog(`${P.nome} topou a mudança para ${cidade}.`,'g'); return true; }
  const v=await modal(`<h2>${esc(P.nome)} não quer se mudar</h2><p>A promoção exige morar em ${cidade}, mas ${esc(P.nome)} trabalha com ${P.prof} aqui e não quer recomeçar do zero.</p>`,
    [{t:'Recusar a promoção',v:0,cls:'ghost'},{t:'Ir mesmo assim',v:1}]);
  if(!v){ addLog('Você recusou a promoção para não mudar de cidade.'); return false; }
  P.rel=clamp(P.rel-35,0,100); S.vida.felicidade=clamp(S.vida.felicidade-10,0,100); addLog(`Relacionamento à distância com ${P.nome}.`,'r'); return true;
}

async function semanaVida(){
  const V=S.vida, A=S.agenda, fam=A.familia||0, sau=A.saude||0, id=idade();
  // saúde e felicidade
  const ds=-Math.max(0,id-40)*.03-Math.max(0,S.estresse-60)/20-(S.energia<20?1:0)+Math.min(sau,4)*1.5+(V.felicidade>70?.5:0)+.3+(S.estresse<30?1:0);
  V.saude=clamp(V.saude+ds,0,100);
  S.estresse=clamp(S.estresse-sau*1.5,0,100);
  const df=(50-V.felicidade)*.08+A.lazer*1+(temFamilia()?fam*1:fam*.4)+(V.parceiro?V.parceiro.rel/100:0)+V.filhos.length*.3
    -(S.estresse>70?2:0)-(!V.parceiro&&id>=35?1:0)+MORADIAS[V.moradia].fel+CARROS[V.carro||0].fel;
  V.felicidade=clamp(V.felicidade+df,0,100);
  if(V.felicidade<25) S.estresse=clamp(S.estresse+3,0,100);
  // custos da família
  const custo=(V.parceiro&&V.parceiro.status==='casado'?300:0)+(V.parceiro&&V.parceiro.pers==='luxo'?600:0)+V.filhos.filter(f=>idadeFilho(f)<22).length*400+manutCarro();
  if(custo) pagarPessoal(custo);
  semanaDividas(); semanaInvest(); await semanaAmigos();
  // aniversário
  if(id>V.ultimoAniv){ V.ultimoAniv=id; addLog(`Você fez ${id} anos.`); }
  // relacionamento
  const P=V.parceiro;
  if(P){
    P.rel=clamp(P.rel+relSemana(P,fam),0,100);
    if(P.rel<12){
      await separar(P,'tempo');
    } else if(P.status==='namoro'&&P.rel>=75&&S.semana-P.desde>=20&&S.semana>=(P.pedidoEm||0)&&Math.random()<.03){
      P.pedidoEm=S.semana+30; // depois de tocar no assunto, só volta a ele bem mais tarde; o pedido fica sempre disponível no menu Vida
      const v=await modal(`<h2>Pedido de casamento?</h2><p>Vocês estão juntos há ${Math.round((S.semana-P.desde)/ANO*12)} meses e a relação está forte (${Math.round(P.rel)}). A festa custa ${brl(30000)}.</p>`,
        [{t:'Ainda não',v:0,cls:'ghost'},{t:'Casar',v:1,cls:'brass',dis:dinheiroPessoal()<30000}]);
      if(v){ pagarPessoal(30000); P.status='casado'; P.rel=clamp(P.rel+10,0,100); V.felicidade=clamp(V.felicidade+20,0,100); addLog(`Você se casou com ${P.nome}.`,'g'); }
      else P.rel=clamp(P.rel-5,0,100);
    } else if(P.status==='casado'&&!V.gravidez&&P.rel>=55&&V.filhos.length<4&&id<48&&Math.random()<.06){
      const v=await modal(`<h2>Aumentar a família?</h2><p>${esc(P.nome)} quer ter ${V.filhos.length?'mais um filho':'um filho'}. Cada filho custa cerca de ${brl(400)} por semana até os 22 anos e pede tempo de família na agenda.</p>`,
        [{t:'Agora não',v:0,cls:'ghost'},{t:'Vamos ter um filho',v:1,cls:'brass'}]);
      if(v){ V.gravidez=S.semana+ANO; addLog('Vocês vão ter um bebê daqui a um ano.','g'); } else P.rel=clamp(P.rel-4,0,100);
    }
  } else if(fam>0&&Math.random()<Math.min(.45,fam*.1)){
    const pg=S.genero==='m'?'f':'m', nome=nomeGenero(pg), prof=pick(AREAS_PROF), pers=pick(Object.keys(PERS_PARC));
    const v=await modal(`<h2>Você conheceu alguém</h2><p>${esc(nome)}, que trabalha com ${prof}, gostou da conversa e quer sair de novo.</p><p style="font-size:12.5px"><b>Personalidade: ${PERS_PARC[pers].nome}.</b> ${PERS_PARC[pers].desc}</p>`,[{t:'Não é o momento',v:0,cls:'ghost'},{t:'Começar a namorar',v:1,cls:'brass'}]);
    if(v){ V.parceiro={nome,prof,pers,genero:pg,rel:45,desde:S.semana,status:'namoro'}; V.felicidade=clamp(V.felicidade+10,0,100); addLog(`Você começou a namorar ${nome}.`,'g'); }
  }
  if(V.parceiro&&Math.random()<.12) await eventoParceiro(V.parceiro);
  // nascimento
  if(V.gravidez&&S.semana>=V.gravidez){
    const gf=Math.random()<.5?'m':'f', f={id:++uid,genero:gf,nome:pick(gf==='m'?PRIM_M:PRIM_F)+' '+sobrenome(),nasc:S.semana,rel:70,direito:false,decidiu:false}; V.filhos.push(f); V.gravidez=null;
    V.felicidade=clamp(V.felicidade+15,0,100);
    await modal(`<h2 class="hi">${esc(f.nome.split(' ')[0])} nasceu</h2><p>${f.genero==='f'?'Bem-vinda':'Bem-vindo'} à família. O bebê muda a rotina: tempo de família na agenda mantém a relação forte.</p>`,[{t:'Continuar',v:1,cls:'brass'}]);
    addLog(`Nasceu ${f.nome}.`,'g');
  }
  // filhos
  for(const f of V.filhos){ f.rel=clamp(f.rel+fam*2-1.5,0,100);
    if(idadeFilho(f)>=18&&!f.decidiu){ f.decidiu=true; f.direito=Math.random()<.25+f.rel/200;
      addLog(f.direito?`${f.nome} entrou na faculdade de Direito.`:`${f.nome} escolheu outra profissão.`, f.direito?'g':''); } }
  const escolares=V.filhos.filter(f=>{const a=idadeFilho(f); return a>=5&&a<=17;});
  if(escolares.length&&Math.random()<.08){ const f=pick(escolares), pn=f.nome.split(' ')[0];
    const v=await modal(`<h2>Dilema de família</h2><p>A apresentação de ${esc(pn)} na escola cai na mesma tarde de um compromisso importante de trabalho.</p>
      <div class="opts"><button class="opt" data-mv="ir"><span>Ir à apresentação</span><b class="num">−2 blocos</b><small>Relação com ${esc(pn)} +15 e felicidade +5. Você perde 2 blocos na próxima semana.</small></button>
      <button class="opt" data-mv="trab"><span>Ficar no trabalho</span><b class="num">±0</b><small>Relação com ${esc(pn)} −15 e felicidade −5.</small></button></div>`,[]);
    if(v==='ir'){ f.rel=clamp(f.rel+15,0,100); V.felicidade=clamp(V.felicidade+5,0,100); V.falta=(V.falta||0)+2; addLog(`Você foi à apresentação de ${pn}.`,'g'); }
    else { f.rel=clamp(f.rel-15,0,100); V.felicidade=clamp(V.felicidade-5,0,100); addLog(`Você faltou à apresentação de ${pn}.`,'r'); } }
  // saúde: doença e morte
  if(V.doente>0) V.doente--;
  else if(V.saude<25&&Math.random()<.3){ V.doente=2; pagarPessoal(5000);
    await modal(`<h2 class="lo">Você adoeceu</h2><p>Anos de estresse cobraram a conta. Tratamento de ${brl(5000)} e duas semanas com 7 blocos a menos.</p>`,[{t:'Continuar',v:1}]); addLog('Você adoeceu: 2 semanas de tratamento.','r'); }
  if(id>=70&&Math.random()<.002*(1+(id-70)/3)*(1.5-V.saude/100)*ANO/10*5){ await fimVida('morte'); return true; }
  if(V.saude<=0&&Math.random()<.2){ await fimVida('morte'); return true; }
  if(['juiz','promotor','defensor'].includes(S.carreira)&&id>=75){ await fimVida('compulsoria'); return true; }
  return false;
}

async function fimVida(motivo){
  hallRegistrar(motivo);
  const V=S.vida, pat=patrimonio(), id=idade();
  const herd=V.filhos.filter(f=>idadeFilho(f)>=22&&f.rel>=40);
  const txt={morte:`${S.nome} morreu aos ${id} anos.`,compulsoria:`Aos ${id} anos, ${S.nome} chegou à aposentadoria compulsória.`,aposentadoria:`${S.nome} se aposentou aos ${id} anos.`}[motivo];
  const reg={nome:S.nome,geracao:V.geracao,carreira:descCarreira(),resumo:resumoCarreira(),idade:id,patrimonio:pat};
  const legado=[...V.legado,reg];
  const v=await modal(`<span class="label">Legado · ${V.geracao}ª geração</span><h2>${esc(txt)}</h2>
    <dl class="meta"><dt>Carreira</dt><dd>${reg.carreira}</dd><dt>Resultado</dt><dd>${reg.resumo}</dd><dt>Prestígio final</dt><dd class="num">${Math.round(S.prest)}</dd>
      <dt>Patrimônio</dt><dd class="num">${brl(pat)}</dd><dt>Família</dt><dd>${V.parceiro?(V.parceiro.status==='casado'?'casamento com ':'namoro com ')+esc(V.parceiro.nome):'sem parceiro'} · ${V.filhos.length} filho(s)</dd></dl>
    ${herd.length?`<p>Quem continua a história da família? O herdeiro recebe metade do patrimônio, o sobrenome famoso e parte das skills.</p>
      <div class="opts">${herd.map(f=>`<button class="opt" data-mv="${f.id}"><span>${esc(f.nome)}</span><b class="num">${idadeFilho(f)} anos</b><small>Relação ${Math.round(f.rel)}${f.direito?' · estudou Direito: começa com skills melhores':''}</small></button>`).join('')}</div>`
      :'<p style="color:var(--muted)">Nenhum filho adulto com boa relação para continuar a dinastia.</p>'}`,[{t:'Encerrar a dinastia',v:'fim',cls:'ghost'}]);
  if(!herd.length||v==='fim'||!v){ S=null; apagarSave(); return; }
  const f=herd.find(x=>String(x.id)===v);
  const car=await modal(`<h2>Que carreira ${esc(f.nome.split(' ')[0])} vai seguir?</h2>`,
    [{t:'Advocacia',v:'adv'},{t:'Juiz',v:'juiz'},{t:'Promotor',v:'promotor'},{t:'Defensor',v:'defensor'}]);
  herdeiro(f,car||'adv',pat,legado);
}
function herdeiro(f,car,pat,legado){
  const old=S, cid=['juiz','promotor','defensor'].includes(old.carreira)?comarcaAtual():old.sede, traits=[old.traits[0],pick(Object.keys(TRAITS).filter(t=>t!==old.traits[0]))];
  novoJogo(f.nome,old.espec,traits,cid); S.genero=f.genero||pick(['m','f']); S.cq=old.cq||cqInicial();
  const V=S.vida; V.idade0=idadeFilho(f)+0; V.ultimoAniv=V.idade0; V.geracao=old.vida.geracao+1; V.legado=legado; V.moradia=old.vida.moradia;
  const herança=Math.max(0,Math.round((pat-MORADIAS[old.vida.moradia].preco)*.5));
  for(const k in S.skills) S.skills[k]=clamp(S.skills[k]+Math.max(0,old.skills[k]-25)*(f.direito?.3:.15),0,100);
  S.prest=30; S.caixa+=Math.round(herança*.5); S.bolso+=Math.round(herança*.5);
  if(car==='juiz'){ iniciarMagistratura(cid,old.espec); } else if(car==='promotor') iniciarMP(cid); else if(car==='defensor') iniciarDP(cid);
  if(car!=='adv'){ S.caixa+=S.bolso; S.bolso=0; }
  S.log=[]; addLog(`${f.nome}, ${V.idade0} anos, ${V.geracao}ª geração da família, começa a carreira com o sobrenome de ${old.nome} e herança de ${brl(Math.max(0,herança))}.`,'g');
  view='escritorio'; salvar();
}

// financiamento de casa e carro: entrada, prazo, juros (tabela Price) e aprovação pela renda
const FIN={
  moradia:{entrada:.2,prazos:[10,20,30],juros:.10,lista:()=>MORADIAS,venda:.8,campo:'moradia'},
  carro:{entrada:.3,prazos:[2,4,5],juros:.20,lista:()=>CARROS,venda:.7,campo:'carro'},
};
const saldoDivida=t=>(S.vida.dividas||[]).filter(d=>!t||d.tipo===t).reduce((a,d)=>a+d.saldo,0);
const comprometido=()=>(S.vida.dividas||[]).reduce((a,d)=>a+d.parcela,0);
function rendaSemanal(){
  if(['juiz','promotor','defensor'].includes(S.carreira)) return salarioAtual()+rendaPassiva();
  const rp=rendaPassiva();
  if(S.carreira==='adv') return S.u.retirada+rp;
  if(S.carreira==='estudante') return MESADA+(S.fac&&S.fac.estagio?S.fac.estagio.bolsa*(S.agenda.estagio||0):0);
  const A=S.ac; return (A.curso&&A.curso.bolsa?A.curso.bolsa:0)+(A.doc?remuneracaoAula()*(S.agenda.docencia||0):0)+(A.roySemana||0); }
function parcelaDe(P,anos,j){ const r=Math.pow(1+j,1/ANO)-1, n=anos*ANO; return {r,n,parcela:Math.round(P*r/(1-Math.pow(1+r,-n)))}; }
const creditoTroca=tipo=>{ const F=FIN[tipo], at=S.vida[F.campo]||0; return F.lista()[at].preco*F.venda-saldoDivida(tipo); };
async function comprarBem(tipo,i){ const F=FIN[tipo], L=F.lista(), V=S.vida, at=V[F.campo]||0; if(i===at||!L[i]||ocupado) return;
  const credito=creditoTroca(tipo), custo=Math.round(L[i].preco-credito), din=dinheiroPessoal();
  if(custo<=0){ trocarBem(tipo,i,custo,null); return; }
  const entrada=Math.round(custo*F.entrada), fin=custo-entrada, renda=rendaSemanal(), lim=renda*.35-comprometido();
  const ops=F.prazos.map(a=>{ const x=parcelaDe(fin,a,F.juros); return {a,...x,total:x.parcela*x.n,ok:x.parcela<=lim&&din>=entrada}; });
  const v=await modal(`<h2>Comprar: ${L[i].nome}</h2>
    <p>Valor de ${brl(L[i].preco)}. ${credito>0?`O bem atual entra por ${brl(credito)}${saldoDivida(tipo)?', já descontada a dívida dele':''}.`:credito<0?`O bem atual ainda deve ${brl(-credito)} além do que vale.`:''} Falta pagar <b>${brl(custo)}</b>.</p>
    <div class="opts"><button class="opt" data-mv="vista" ${din<custo?'disabled':''}><span>À vista</span><b class="num">${brl(custo)}</b><small>${din<custo?'Dinheiro pessoal insuficiente':'Sem juros'}</small></button>
    ${ops.map(o=>`<button class="opt" data-mv="${o.a}" ${o.ok?'':'disabled'}><span>Financiar em ${o.a} anos</span><b class="num">${brl(o.parcela)}/sem</b><small>Entrada de ${brl(entrada)} (${pct(F.entrada)}) · juros de ${pct(F.juros)} ao ano · total pago ${brl(o.total+entrada)}${o.ok?'':din<entrada?' · falta dinheiro para a entrada':' · parcela acima de 35% da sua renda'}</small></button>`).join('')}</div>
    <p style="font-size:12px;color:var(--muted);margin:0">Renda considerada: ${brl(renda)} por semana. Parcelas que você já paga: ${brl(comprometido())} por semana. O banco aprova parcelas de até 35% da renda. Com 3 semanas seguidas de dinheiro pessoal negativo, o banco retoma o bem.</p>`,
    [{t:'Cancelar',v:'',cls:'ghost'}]);
  if(!v) return;
  if(v==='vista') trocarBem(tipo,i,custo,null);
  else { const o=ops.find(x=>String(x.a)===v); trocarBem(tipo,i,entrada,{saldo:fin,parcela:o.parcela,restantes:o.n,r:o.r,anos:o.a}); } }
function trocarBem(tipo,i,pagar,div){ const F=FIN[tipo], L=F.lista(), V=S.vida, at=V[F.campo]||0;
  V.dividas=(V.dividas||[]).filter(d=>d.tipo!==tipo); // a dívida do bem antigo é quitada na troca
  pagarPessoal(pagar);
  if(div) V.dividas.push({id:++uid,tipo,nome:L[i].nome,...div});
  if(tipo==='carro'&&L[i].prest>L[at].prest) S.prest=clamp(S.prest+L[i].prest-L[at].prest,0,100);
  V.felicidade=clamp(V.felicidade+(i>at?(tipo==='moradia'?8:5):-5),0,100); V[F.campo]=i;
  addLog(i?`${div?'Financiou':'Comprou'}: ${L[i].nome}${div?` em ${div.anos} anos, ${brl(div.parcela)} por semana`:''}${pagar<0?`, e sobraram ${brl(-pagar)}`:''}.`:`Você vendeu ${tipo==='moradia'?'o imóvel':'o carro'}${pagar<0?' e recebeu '+brl(-pagar):''}.`,'g');
  salvar(); render(); }
function semanaDividas(){ const V=S.vida; if(!V.dividas||!V.dividas.length){ V.atraso=0; return; }
  for(const d of V.dividas){ pagarPessoal(d.parcela); d.saldo=Math.max(0,d.saldo*(1+d.r)-d.parcela); d.restantes--; }
  for(const d of V.dividas) if(d.restantes<=0||d.saldo<1) addLog(`Financiamento quitado: ${d.nome}.`,'g');
  V.dividas=V.dividas.filter(d=>d.restantes>0&&d.saldo>=1);
  if(dinheiroPessoal()<0&&V.dividas.length){ V.atraso=(V.atraso||0)+1; addLog(`Parcelas atrasadas: ${V.atraso} de 3 semanas antes da retomada.`,'r');
    if(V.atraso>=3){ const d=V.dividas[0]; V[FIN[d.tipo].campo]=0; V.dividas=V.dividas.filter(x=>x!==d); V.atraso=0;
      S.prest=clamp(S.prest-3,0,100); V.felicidade=clamp(V.felicidade-15,0,100); addLog(`O banco retomou: ${d.nome}. −3 de prestígio.`,'r'); } }
  else V.atraso=0; }
function quitarDivida(id){ const V=S.vida, d=(V.dividas||[]).find(x=>x.id===id); if(!d||dinheiroPessoal()<d.saldo) return;
  pagarPessoal(Math.round(d.saldo)); V.dividas=V.dividas.filter(x=>x!==d); addLog(`Você quitou antecipado: ${d.nome}.`,'g'); salvar(); render(); }
function painelDividas(){ const V=S.vida, D=V.dividas||[]; if(!D.length) return '';
  return `<section class="panel"><div class="panel-head"><h2>Financiamentos</h2><span class="num">${brl(comprometido())}/sem</span></div>
    ${D.map(d=>`<div class="row" style="flex-wrap:wrap"><span class="name">${d.nome} · ${Math.ceil(d.restantes/ANO)} ano(s) restantes</span><span class="num">saldo ${brl(d.saldo)}</span>
      <button class="chip" data-act="quitar" data-id="${d.id}" ${dinheiroPessoal()<d.saldo?'disabled':''}>Quitar</button></div>`).join('')}
    ${V.atraso?`<p class="lo" style="margin:0;font-size:12.5px">Parcelas atrasadas há ${V.atraso} semana(s). Na terceira, o banco retoma o bem.</p>`:''}
    <p style="margin:0;font-size:12px;color:var(--muted)">As parcelas saem do dinheiro pessoal toda semana. Quitar antes evita os juros restantes.</p></section>`; }
function painelBens(){ const V=S.vida;
  const item=(tipo,i)=>{ const F=FIN[tipo], L=F.lista(), it=L[i], at=V[F.campo]||0, meu=i===at, c=Math.round(it.preco-creditoTroca(tipo));
    const extra=tipo==='moradia'?`${it.preco?'Valor '+brl(it.preco)+' · ':''}felicidade +${it.fel} por semana${it.preco?' · financiável em até 30 anos':''}`
      :it.preco?`Valor ${brl(it.preco)} · +1 bloco por semana (menos tempo no trânsito) · felicidade +${it.fel}/sem · manutenção ${brl(Math.round(it.preco*.0015/10)*10)}/sem${it.prest?` · +${it.prest} de prestígio`:''}`:'Sem custo, mas o trânsito come tempo da agenda';
    return `<button class="opt" data-act="${tipo}" data-v="${i}" ${meu?'disabled':''}><span>${it.nome}${meu?' · atual':''}</span><b class="num">${meu?'—':c>=0?brl(c):'+'+brl(-c)}</b><small>${extra}</small></button>`; };
  return `<section class="panel"><div class="panel-head"><h2>Casa e carro</h2><span class="label">à vista ou financiado</span></div>
    <span class="label">Moradia · o imóvel atual entra por 80% do valor, menos o que ainda deve</span>
    <div class="opts">${MORADIAS.map((_,i)=>item('moradia',i)).join('')}</div>
    <span class="label">Carro · o atual entra por 70% do valor, menos o que ainda deve</span>
    <div class="opts">${CARROS.map((_,i)=>item('carro',i)).join('')}</div>
  </section>`; }

async function aposentar(){ if(idade()<60||ocupado) return;
  const v=await modal(`<h2>Aposentar-se?</h2><p>Você encerra a carreira aos ${idade()} anos. Se houver filhos adultos, a história continua com um deles.</p>`,[{t:'Continuar trabalhando',v:0,cls:'ghost'},{t:'Aposentar',v:1}]);
  if(!v) return; ocupado=true; try{ await fimVida('aposentadoria'); } finally { ocupado=false; render(); } }

        <button class="btn ghost" data-act="aposentar" ${id<60?'disabled':''}>${id<60?`Aposentadoria a partir dos 60 (faltam ${60-id} anos)`:'Aposentar-se'}</button>
        <p style="margin:0;font-size:12px;color:var(--muted)">A vida corre mais rápido que a agenda: cada ${ANO} semanas jogadas são 1 ano de idade. Saúde cai com a idade e o estresse; academia recupera. Felicidade acima de 80 dá +3 nos casos; saúde abaixo de 40 tira 4.</p>
      </section>

        <ul class="break">

          <div class="vs">${barra('Relação',P.rel,P.rel<30?'var(--loss)':'var(--brass)')}</div>
