// ===================== PARCEIRO: PERSONALIDADE E INTERAÇÕES =====================
const PERS_PARC={
  ciume:{nome:'Ciúme',desc:'Reclama das semanas com muito trabalho (15 blocos ou mais), mas valoriza cada bloco de família.',mudar:0},
  ambicao:{nome:'Ambição',desc:'Fica feliz com o seu prestígio e se irrita quando falta dinheiro. Aceita mudar de cidade por uma promoção.',mudar:.2},
  lar:{nome:'Vida caseira',desc:'Precisa de mais tempo de família e resiste a mudanças de cidade.',mudar:-.3},
  aventura:{nome:'Espírito aventureiro',desc:'Lazer também conta como tempo juntos, viagens valem o dobro e mudar de cidade é fácil.',mudar:.3},
  independencia:{nome:'Independência',desc:'Sente menos a sua ausência, mas também se apega menos e pensa duas vezes antes de ter filhos.',mudar:.1},
  luxo:{nome:'Gosto por luxo',desc:'Custa R$ 600 a mais por semana, valoriza presentes caros e uma casa à altura.',mudar:0},
  juridico:{nome:'Mesma área (jurídica)',desc:'Dá conselhos em casa: +2 de chance nos casos enquanto a relação estiver boa.',mudar:0},
};
const workBlocos=()=>blocosUsados()-S.agenda.lazer-vidaBlocos();
function relSemana(P,fam){
  if(!P.pers) P.pers=pick(Object.keys(PERS_PARC));
  const p=P.pers, trab=workBlocos(); let d=fam*2.5-3.5+(S.vida.felicidade>70?1:0);
  if(p==='ciume'){ d+=fam*.5; if(trab>=15) d-=4; }
  if(p==='ambicao') d+=(S.prest-50)/25+(dinheiroPessoal()<10000?-2:0);
  if(p==='lar') d+=fam-1;
  if(p==='aventura') d+=S.agenda.lazer*2;
  if(p==='independencia') d=fam*1.5-1.5+(S.vida.felicidade>70?1:0);
  if(p==='luxo') d+=S.vida.moradia*1.5-2;
  if(P.distancia&&S.semana<P.distancia) d-=1;
  return d;
}
const chanceConversa=()=>clamp(sig(((S.skills.oratoria+S.skills.negociacao)/2-40)/10),.05,.95);
async function separar(P,motivo){ const V=S.vida;
  let txt={tempo:`${esc(P.nome)} decidiu terminar. Faltou tempo juntos: a agenda não teve espaço para a família.`,vaga:`${esc(P.nome)} aceitou a vaga em outra cidade e vocês terminaram.`,voce:`Você terminou com ${esc(P.nome)}.`}[motivo];
  if(P.status==='casado'){ const partilha=Math.max(0,Math.round(dinheiroPessoal()*.3)); pagarPessoal(partilha); txt+=` A partilha de bens do divórcio custou ${brl(partilha)}.`; }
  await modal(`<h2 class="lo">${P.status==='casado'?'Divórcio':'Fim do namoro'}</h2><p>${txt}</p>`,[{t:'Continuar',v:1}]);
  V.parceiro=null; V.felicidade=clamp(V.felicidade-(motivo==='voce'?10:20),0,100); S.estresse=clamp(S.estresse+10,0,100);
  for(const f of V.filhos) if(idadeFilho(f)<18) f.rel=clamp(f.rel-10,0,100);
  addLog(P.status==='casado'?`Divórcio de ${P.nome}.`:`Fim do namoro com ${P.nome}.`,'r');
}
async function eventoParceiro(P){ const V=S.vida, trab=workBlocos(), pn=esc(P.nome.split(' ')[0]); const evs=['aniversario','sogros'];
  if(trab>=14) evs.push('briga','briga'); if(P.pers==='aventura'||P.pers==='luxo') evs.push('viagem'); if(S.semana-P.desde>20) evs.push('emprego');
  const e=pick(evs);
  if(e==='briga'){ const ch=chanceConversa();
    const v=await modal(`<h2>Briga em casa</h2><p>${pn} diz que você só pensa em trabalho${P.pers==='ciume'?' e desconfia das noites no escritório':''}.</p><div class="opts">
      <button class="opt" data-mv="noite"><span>Pedir desculpas e reservar uma noite</span><b class="num">−1 bloco</b><small>Relação +6. Você perde 1 bloco na próxima semana.</small></button>
      <button class="opt" data-mv="fase"><span>Explicar que é uma fase</span><b class="num">${pct(ch)}</b><small>Usa Oratória e Negociação. Se der certo, fica tudo bem; se não, relação −10.</small></button></div>`,[]);
    if(v==='noite'){ P.rel=clamp(P.rel+6,0,100); V.falta=(V.falta||0)+1; addLog(`Você reservou uma noite para ${P.nome}.`,'g'); }
    else if(Math.random()<ch) addLog(`${P.nome} entendeu que é uma fase.`,'g'); else { P.rel=clamp(P.rel-10,0,100); addLog(`A briga com ${P.nome} piorou.`,'r'); } }
  if(e==='aniversario'){ const lx=P.pers==='luxo';
    const v=await modal(`<h2>${P.status==='casado'?'Aniversário de casamento':'Aniversário de namoro'}</h2><p>Hoje é uma data importante para vocês. O que você faz?</p><div class="opts">
      <button class="opt" data-mv="simples"><span>Jantar simples em casa</span><b class="num">${brl(300)}</b><small>Relação +${lx?1:4}</small></button>
      <button class="opt" data-mv="caro"><span>Presente e restaurante caro</span><b class="num">${brl(3000)}</b><small>Relação +${lx?16:10}</small></button>
      <button class="opt" data-mv="esqueci"><span>Esquecer a data</span><b class="num">±0</b><small>Relação −12</small></button></div>`,[]);
    if(v==='simples'){ pagarPessoal(300); P.rel+=lx?1:4; } else if(v==='caro'){ pagarPessoal(3000); P.rel+=lx?16:10; } else { P.rel-=12; addLog(`Você esqueceu a data com ${P.nome}.`,'r'); }
    P.rel=clamp(P.rel,0,100); }
  if(e==='sogros'){ const v=await modal(`<h2>Visita da família de ${pn}</h2><p>A família de ${pn} vem passar o fim de semana.</p>`,[{t:'Trabalhar no fim de semana',v:0,cls:'ghost'},{t:'Receber a família (−1 bloco)',v:1,cls:'brass'}]);
    if(v){ P.rel=clamp(P.rel+5,0,100); V.falta=(V.falta||0)+1; } else P.rel=clamp(P.rel-(P.pers==='lar'?10:6),0,100); }
  if(e==='viagem'){ const v=await modal(`<h2>${pn} quer viajar</h2><p>Uma semana de férias juntos, longe do trabalho.</p>`,[{t:'Agora não dá',v:0,cls:'ghost'},{t:`Viajar · ${brl(6000)} e −4 blocos`,v:1,cls:'brass',dis:dinheiroPessoal()<6000}]);
    if(v){ pagarPessoal(6000); V.falta=(V.falta||0)+4; P.rel=clamp(P.rel+(P.pers==='aventura'?25:15),0,100); V.felicidade=clamp(V.felicidade+15,0,100); S.estresse=clamp(S.estresse-25,0,100); addLog(`Viagem de férias com ${P.nome}.`,'g'); }
    else P.rel=clamp(P.rel-(P.pers==='aventura'?8:4),0,100); }
  if(e==='emprego'){ const cid=pick(Object.values(CIDADES)).nome, ch=clamp(P.rel/100+(P.pers==='ambicao'?-.2:0),.05,.95);
    const v=await modal(`<h2>${pn} recebeu uma proposta de emprego</h2><p>Uma ótima vaga em ${cid}, na área de ${P.prof}.</p><div class="opts">
      <button class="opt" data-mv="apoiar"><span>Apoiar a decisão e namorar à distância</span><b class="num">+8</b><small>${pn} aceita a vaga. Felicidade −5 e, por 20 semanas, a relação cai 1 ponto a mais por semana.</small></button>
      <button class="opt" data-mv="pedir"><span>Pedir para ficar</span><b class="num">${pct(ch)}</b><small>Se ${pn} recusar a vaga, relação −5. Se aceitar, vocês terminam.</small></button></div>`,[]);
    if(v==='apoiar'){ P.rel=clamp(P.rel+8,0,100); P.distancia=S.semana+20; V.felicidade=clamp(V.felicidade-5,0,100); addLog(`${P.nome} aceitou uma vaga em ${cid}. Relação à distância.`); }
    else if(Math.random()<ch){ P.rel=clamp(P.rel-5,0,100); addLog(`${P.nome} recusou a vaga para ficar.`); }
    else await separar(P,'vaga'); }
}
async function acaoParceiro(tipo){ const V=S.vida, P=V.parceiro; if(!P||ocupado) return; V.acoes=V.acoes||{}; if(V.acoes[tipo]===S.semana) return;
  ocupado=true;
  try{ V.acoes[tipo]=S.semana;
    if(tipo==='jantar'){ pagarPessoal(400); P.rel+=P.pers==='luxo'?9:6; addLog(`Jantar a dois com ${P.nome}.`,'g'); }
    if(tipo==='viagem'){ pagarPessoal(4000); V.falta=(V.falta||0)+2; P.rel+=P.pers==='aventura'?28:15; V.felicidade=clamp(V.felicidade+12,0,100); S.estresse=clamp(S.estresse-15,0,100); addLog(`Fim de semana de viagem com ${P.nome}.`,'g'); }
    if(tipo==='conversa'){ const ok=await rolar('Conversa sobre a relação','Oratória e Negociação contam. Vocês sentam para falar com calma.',chanceConversa(),'Vocês se entenderam','Piorou');
      P.rel+=ok?15:-5; }
    if(tipo==='casar'){ const ch=chanceCasar();
      const ok=await rolar('Pedido de casamento',`A festa custa ${brl(30000)}.`,ch,'Sim!','Ainda não');
      if(ok){ pagarPessoal(30000); P.status='casado'; P.rel+=10; V.felicidade=clamp(V.felicidade+20,0,100); addLog(`Você se casou com ${P.nome}.`,'g'); } else P.rel-=10; }
    if(tipo==='filho'){ const ch=clamp(P.rel/100-(P.pers==='independencia'?.25:0)+(P.pers==='lar'?.1:0),.05,.95);
      const ok=await rolar('Conversa sobre ter um filho','Cada filho custa cerca de R$ 400 por semana até os 22 anos.',ch,'Vamos ter um filho','Agora não');
      if(ok){ V.gravidez=S.semana+ANO; addLog('Vocês vão ter um bebê daqui a um ano.','g'); } else P.rel-=3; }
    if(tipo==='terminar'){ const v=await modal(`<h2>Terminar com ${esc(P.nome)}?</h2><p>${P.status==='casado'?'O divórcio leva 30% do seu dinheiro pessoal na partilha.':'O namoro acaba.'} Filhos pequenos sentem a separação.</p>`,[{t:'Cancelar',v:0,cls:'ghost'},{t:'Terminar',v:1}]);
      if(v) await separar(P,'voce'); }
    if(V.parceiro) V.parceiro.rel=clamp(V.parceiro.rel,0,100);
    salvar();
  } finally { ocupado=false; render(); }
}
const chanceCasar=()=>{ const P=S.vida.parceiro; return clamp(P.rel/100+(P.pers==='ambicao'&&S.prest>50?.1:0)-(P.pers==='independencia'?.1:0),.05,.95); };
function acoesParceiroHtml(){ const V=S.vida, P=V.parceiro, A=V.acoes||{}, f=t=>A[t]===S.semana, din=dinheiroPessoal();
  const b=(t,l,dis)=>`<button class="chip" data-act="pAcao" data-v="${t}" ${dis||f(t)?'disabled':''}>${l}</button>`;
  return `<span class="label">Ações nesta semana</span><div class="chips">
    ${b('jantar','Jantar a dois · '+brl(400),din<400)}
    ${b('viagem','Fim de semana fora · '+brl(4000)+' · −2 blocos',din<4000)}
    ${P.rel<60?b('conversa','Conversar sobre a relação · '+pct(chanceConversa())):''}
    ${P.status==='namoro'?b('casar','Pedir em casamento · '+brl(30000)+' · '+pct(chanceCasar()),din<30000):''}
    ${P.status==='casado'&&!V.gravidez&&V.filhos.length<4&&idade()<48?b('filho','Propor ter um filho'):''}
    <button class="chip bad" data-act="pAcao" data-v="terminar">Terminar</button></div>`; }

// ===================== FACULDADE E EXAME DA OAB =====================
const FACS={publica:{nome:'Universidade pública',mensal:0,dif:2,prest:8,vest:.45},ponta:{nome:'Faculdade particular de ponta',mensal:700,dif:1.5,prest:6,vest:1},comum:{nome:'Faculdade particular',mensal:300,dif:.5,prest:0,vest:1}};
const ESTAGIOS={adv:{nome:'Escritório de advocacia',bolsa:90},juiz:{nome:'Gabinete de juiz',bolsa:60},promotor:{nome:'Ministério Público',bolsa:60},defensor:{nome:'Defensoria Pública',bolsa:50}};
const MESADA=500;
const estudBlocos=()=>S.carreira==='estudante'?['aulas','estagio','nucleo','ic','bico'].reduce((a,k)=>a+(S.agenda[k]||0),0):0;
async function iniciarComFaculdade(tier){
  const F0=FACS[tier]; let t=tier;
  if(tier==='publica'){ const ch=clamp(F0.vest+(S.traits.includes('rato')?.15:0),.05,.95);
    const ok=await rolar('Vestibular da universidade pública','A concorrência é grande. Estudo e o traço Rato de biblioteca ajudam.',ch,'Aprovado','Não passou');
    if(!ok){ t='comum'; addLog('Você não passou na pública e entrou numa faculdade particular.','r'); } }

    if(S.estresse>=100){ S.disp=10; S.estresse=70; addLog('Burnout: você só terá 10 blocos na próxima semana.','r'); }
    salvar();
  } finally { ocupado=false; render(); }

const gauss=()=>{ let u=0,v=0; while(!u) u=Math.random(); while(!v) v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
const invInicial=()=>({rf:{v:0,ap:0},acoes:{v:0,ap:0},fii:{v:0,ap:0}});
const totalInvest=()=>{ const I=S.vida.inv||invInicial(); return I.rf.v+I.acoes.v+I.fii.v; };

  const div=I.fii.v*.09/ANO; renda+=div; I.fii.v*=1+.015*gauss();
  if((I.acoes.v>0||I.fii.v>0)&&Math.random()<.025){ I.acoes.v*=.75; I.fii.v*=.9; addLog('Crise na bolsa: ações caíram 25% e fundos imobiliários 10%.','r'); }

  if(renda) pagarPessoal(-Math.round(renda));

const femG=(t,g)=>g==='f'?String(t).replace(/(Advogado|Sócio|fundador|substituto|público|associado|Doutor|Juiz|Promotor|Procurador|Defensor|Desembargador|Ministro|Mestrando|Professor)(?![a-zçãáéíóú])/g,w=>FEM2[w]):t;

const npcTipoTxt=n=>{ const t=npcTipo(n); return t==='amigo'?(n.genero==='f'?'amiga':'amigo'):t==='rival'?'rival':(n.genero==='f'?'conhecida':'conhecido'); };
const npcCargo=n=>n.nivel<0?(n.genero==='f'?'Estudante de Direito':'Estudante de Direito'):femG(NPC_CAR[n.car][n.nivel],n.genero);
function criarColegas(){ const cars=['adv','adv','juiz','promotor','defensor','academico'];
  S.npcs=[60,45,-45,-30].map(rel=>{ const g=Math.random()<.5?'m':'f'; return {id:++uid,nome:nomeGenero(g),genero:g,rel,car:pick(cars),nivel:0,cidade:Math.random()<.7?S.sede:pick(Object.keys(CIDADES)),acao:0}; }); }
function npcTag(id){ const n=npcPor(id); if(!n) return ''; const t=npcTipo(n); return ` · <span class="${t==='rival'?'lo':t==='amigo'?'hi':''}">${esc(n.nome.split(' ')[0])}, ${npcTipoTxt(n)} da faculdade</span>`; }
function marcarNPC(c){ const ns=(S.npcs||[]).filter(n=>n.nivel>=0&&n.cidade===c.cidade);
  const j=ns.find(n=>n.car==='juiz'&&n.nivel<=1&&npcTipo(n)!=='conhecido'); if(j&&Math.random()<.15){ c.npcJuiz=j.id; c.juizNome=femG('Juiz',j.genero)+' '+j.nome; }
  const opp=ns.filter(n=>(c.area==='penal'?['promotor','defensor']:['adv']).includes(n.car)&&npcTipo(n)!=='conhecido'); if(opp.length&&Math.random()<.15) c.npcAdv=pick(opp).id; }
function indicacoes(of){ for(const n of (S.npcs||[])) if(n.car==='adv'&&n.nivel>=0&&n.rel>=50&&Math.random()<.15){ const c=novoCaso(S.sede); c.indicadoPor=n.nome; of.push(c); } }

  if(c.npcJuiz){ const n=npcPor(c.npcJuiz); if(npcTipo(n)==='rival') add('Juiz é seu desafeto',-4); else if(c.amizadeOculta) add('Juiz amigo (amizade não declarada)',4); }
  if(c.npcAdv&&npcTipo(npcPor(c.npcAdv))==='rival') add('Rival do outro lado',-3); }
async function eticaAmigoJuiz(c){ const n=npcPor(c.npcJuiz);
  const v=await modal(`<h2>O juiz é seu amigo</h2><p>${esc(n.nome)}, ${npcTipoTxt(n)} desde a faculdade, é quem vai julgar “${esc(c.titulo)}”. Amizade íntima com o advogado pode tornar o juiz suspeito.</p><div class="opts">

  if(S.casos.length<maxCasos()){ S.casos.push(c); S.ofertas=S.ofertas.filter(x=>x.id!==c.id); addLog(`Aceitou “${c.titulo}” (${RAR[c.rar].nome}, ${brl(c.valor)}).`); }

async function semanaAmigos(){ const N=S.npcs||[]; if(!N.length) return;
  for(const n of N){ n.rel+= n.rel>0?-.4:n.rel<-20?.2:0; n.rel=clamp(n.rel,-100,100);
    if(n.nivel>=0&&n.nivel<3&&Math.random()<.012){ n.nivel++; addLog(`${n.nome} agora é ${npcCargo(n).toLowerCase()}.`); } }
  if(Math.random()>.1) return;
  const n=pick(N), t=npcTipo(n), pn=esc(n.nome.split(' ')[0]), pub=['juiz','promotor','defensor'].includes(S.carreira);
  if(t==='amigo'&&pub&&n.car==='adv'&&n.nivel>=0){
    const v=await modal(`<h2>Pedido de ${pn}</h2><p>${esc(n.nome)}, ${npcTipoTxt(n)} da faculdade e hoje ${npcCargo(n).toLowerCase()}, pede que você “dê uma olhada com carinho” num processo de um cliente.</p>`,[{t:'Recusar',v:0,cls:'ghost'},{t:'Ajudar',v:1}]);
    if(v){ n.rel+=15; S.integ=clamp(S.integ-10,0,100); if(Math.random()<.2){ S.prest=clamp(S.prest-6,0,100); addLog(`Vazou o favor que você fez para ${n.nome}. −6 de prestígio.`,'r'); } } else { n.rel-=15; S.integ=clamp(S.integ+2,0,100); } }
  else if(t==='amigo'&&n.car==='academico'&&n.nivel>=1){
    const v=await modal(`<h2>Convite de ${pn}</h2><p>${esc(n.nome)} convida você para escrever um artigo em coautoria.</p>`,[{t:'Agora não',v:0,cls:'ghost'},{t:'Aceitar (−1 bloco)',v:1,cls:'brass'}]);
    if(v){ S.vida.falta=(S.vida.falta||0)+1; n.rel+=8; S.ac.indice+=2; S.ac.pubs.push({tipo:'artigo',titulo:tituloPesquisa(S.espec),qualis:'A2',pts:2,semana:S.semana}); S.prest=clamp(S.prest+1,0,100); addLog(`Artigo em coautoria com ${n.nome} publicado.`,'g'); } }
  else if(t==='amigo'){
    const v=await modal(`<h2>${pn} chamou para almoçar</h2><p>${esc(n.nome)}, ${npcCargo(n).toLowerCase()}, quer colocar a conversa em dia e apresentar gente importante.</p>`,[{t:'Não dá',v:0,cls:'ghost'},{t:'Ir (−1 bloco)',v:1,cls:'brass'}]);
    if(v){ S.vida.falta=(S.vida.falta||0)+1; n.rel+=10; S.prest=clamp(S.prest+1,0,100); S.vida.felicidade=clamp(S.vida.felicidade+3,0,100); } else n.rel-=4; }
  else if(t==='rival'&&S.prest>=25){ const ch=clamp(sig((S.skills.oratoria-40)/10),.05,.95);
    const v=await modal(`<h2>${pn} provocou você</h2><p>${esc(n.nome)}, seu rival desde a faculdade, criticou o seu trabalho numa entrevista.</p><div class="opts">
      <button class="opt" data-mv="resp"><span>Responder em público</span><b class="num">${pct(ch)}</b><small>Usa Oratória. Sucesso +2 de prestígio; falha −2.</small></button>
      <button class="opt" data-mv="ign"><span>Ignorar</span><b class="num">−1</b><small>−1 de prestígio.</small></button></div>`,[]);
    if(v==='resp'){ if(Math.random()<ch){ S.prest=clamp(S.prest+2,0,100); addLog(`Você respondeu bem a ${n.nome}.`,'g'); } else { S.prest=clamp(S.prest-2,0,100); addLog(`A resposta a ${n.nome} pegou mal.`,'r'); } n.rel-=5; }
    else S.prest=clamp(S.prest-1,0,100); }
}

  {id:'ger2',cat:'dinastia',tier:'raro',nome:'Dinastia',desc:'Passe a carreira a um filho.',ok:()=>S.vida.geracao>=2},
  {id:'ger3',cat:'dinastia',tier:'epico',nome:'Três gerações',desc:'Chegue à 3ª geração da família.',ok:()=>S.vida.geracao>=3},
  {id:'stf2',cat:'dinastia',tier:'epico',nome:'Linhagem suprema',desc:'Duas gerações da família no STF.',ok:()=>S.cq.stf.length>=2,prog:()=>[S.cq.stf.length,2]},
  {id:'stf3',cat:'dinastia',tier:'lendario',nome:'Três gerações no STF',desc:'Três gerações da família no STF.',ok:()=>S.cq.stf.length>=3,prog:()=>[S.cq.stf.length,3]},
];
const cqInicial=()=>({ids:{},cont:{lend:0,hist:0,divida:0},car:[],stf:[],rivais:[]});
const cqPontos=(fil=()=>true)=>CONQUISTAS.filter(c=>S.cq.ids[c.id]&&fil(S.cq.ids[c.id])).reduce((a,c)=>a+CQ_TIER[c.tier].pts,0);
function cqCheck(){ if(!S) return; const Q=S.cq||(S.cq=cqInicial()), V=S.vida;
  if(['adv','juiz','promotor','defensor','academico'].includes(S.carreira)&&!Q.car.includes(S.carreira)) Q.car.push(S.carreira);
  if(S.carreira==='juiz'&&S.j.cargo>=4&&!Q.stf.includes(V.geracao)) Q.stf.push(V.geracao);
  if((V.dividas||[]).length) Q.cont.divida=1;
  for(const n of (S.npcs||[])) if(n.rel<0&&!Q.rivais.includes(n.id)) Q.rivais.push(n.id);
  for(const c of CONQUISTAS){ if(Q.ids[c.id]) continue; let ok=false; try{ ok=c.ok(); }catch(e){}
    if(!ok) continue; Q.ids[c.id]={semana:S.semana,ger:V.geracao,quem:S.nome}; hallMarcar(c.id);
    addLog(`Conquista ${CQ_TIER[c.tier].nome.toLowerCase()}: ${c.nome}.`,'g'); toastCq(c); } }
function cqVitoria(c,res){ if(!S.cq) S.cq=cqInicial(); if(c.rar==='lendario') S.cq.cont.lend++; if(res==='historica') S.cq.cont.hist++; cqCheck(); }

// toasts: não bloqueiam o jogo, somem sozinhos
function toastCq(c){ let box=document.getElementById('toasts'); if(!box){ box=document.createElement('div'); box.id='toasts'; document.body.appendChild(box); }
  const t=document.createElement('div'); t.className='toast'; t.style.setProperty('--tc',`var(--r-${c.tier})`);
  t.innerHTML=`<span class="label">Conquista ${CQ_TIER[c.tier].nome.toLowerCase()} · +${CQ_TIER[c.tier].pts}</span><b>${esc(c.nome)}</b><small>${esc(c.desc)}</small>`;
  box.appendChild(t); setTimeout(()=>t.classList.add('sai'),4200); setTimeout(()=>t.remove(),4700); }

// Hall da Fama: localStorage próprio, sobrevive ao fim da partida
function hallLer(){ try{ const r=JSON.parse(localStorage.getItem('toga-hall')||'null'); if(r&&Array.isArray(r.vidas)) return {vidas:r.vidas,ids:r.ids||{}}; }catch(e){} return {vidas:[],ids:{}}; }
function hallGravar(H){ try{ localStorage.setItem('toga-hall',JSON.stringify(H)); }catch(e){} }
function hallMarcar(id){ const H=hallLer(); if(!H.ids[id]){ H.ids[id]=1; hallGravar(H); } }
function legadoPontos(pat){ const ger=S.vida.geracao; return Math.round(S.prest+cqPontos(x=>x.ger===ger)+Math.min(200,Math.max(0,pat)/1e5)); }
function hallRegistrar(motivo){ if(!S||S.hallOk===S.semana) return; S.hallOk=S.semana; cqCheck();
  const pat=patrimonio(), ger=S.vida.geracao, H=hallLer();
  H.vidas.push({nome:S.nome,genero:S.genero,geracao:ger,carreira:descCarreira(),resumo:resumoCarreira(),idade:idade(),prest:Math.round(S.prest),patrimonio:pat,
    conq:CONQUISTAS.filter(c=>S.cq.ids[c.id]&&S.cq.ids[c.id].ger===ger).length,pontos:legadoPontos(pat),motivo,data:new Date().toISOString().slice(0,10)});
  const nova=H.vidas[H.vidas.length-1]; H.vidas.sort((a,b)=>b.pontos-a.pontos); H.vidas=H.vidas.slice(0,50); hallGravar(H); if(window.TOGA_ONLINE) window.TOGA_ONLINE.enviarHall(nova); }
const MOTIVO_HALL={morte:'faleceu',compulsoria:'compulsória',aposentadoria:'aposentou-se',falencia:'falência',encerrada:'carreira encerrada'};
function painelHall(lim=10){ const H=hallLer();
  return `<section class="panel"><div class="panel-head"><h2>Hall da Fama</h2><span class="label">${H.vidas.length} vida${H.vidas.length===1?'':'s'} registrada${H.vidas.length===1?'':'s'}</span></div>
    ${H.vidas.length?`<ol class="hall">${H.vidas.slice(0,lim).map((v,i)=>`<li class="${i===0?'top':''}"><span class="num pos">${i+1}</span>
      <div><b>${esc(v.nome)}</b> <span class="label">${v.geracao}ª geração · ${v.idade} anos · ${MOTIVO_HALL[v.motivo]||v.motivo}</span><small>${v.carreira} · ${v.resumo} · prestígio ${v.prest} · ${brl(v.patrimonio)} · ${v.conq} conquista${v.conq===1?'':'s'}</small></div>
      <b class="num pts">${v.pontos}</b></li>`).join('')}</ol>
      <p style="margin:0;font-size:12px;color:var(--muted)">Pontos de legado: prestígio final + pontos das conquistas obtidas na vida + 1 ponto por R$ 100 mil de patrimônio (até 200).</p>`
    :'<p style="margin:0;color:var(--muted)">Nenhuma vida encerrada ainda. Quando uma carreira terminar, por morte, aposentadoria ou falência, ela entra aqui, mesmo depois de apagar o save.</p>'}
    <div class="hall-online" data-lim="${lim}"></div></section>`; }

function renderConquistas(){ cqCheck(); const Q=S.cq, H=hallLer(), feitas=CONQUISTAS.filter(c=>Q.ids[c.id]).length, ger=S.vida.geracao;
  const card=c=>{ const u=Q.ids[c.id], ant=!u&&H.ids[c.id], p=!u&&c.prog?(()=>{ try{ return c.prog(); }catch(e){ return null; } })():null;

      <small>${esc(c.desc)}</small>
      ${u?`<span class="label">${u.ger!==ger?`${u.ger}ª geração · ${esc(u.quem||'')}`:`semana ${u.semana}`}</span>`
        :p?`<div class="bar"><i style="width:${Math.min(100,p[0]/p[1]*100)}%;background:var(--tc)"></i></div><span class="label">${Math.min(p[0],p[1])} de ${p[1]}${ant?' · já obtida em outra partida':''}</span>`

  app.innerHTML=`${header()}
  <div class="grid">

        <dl class="meta"><dt>Pontos de legado</dt><dd class="num">${legadoPontos(patrimonio())}</dd><dt>Conquistas desta vida</dt><dd class="num">${CONQUISTAS.filter(c=>Q.ids[c.id]&&Q.ids[c.id].ger===ger).length}</dd>
          <dt>Carreiras na família</dt><dd>${Q.car.length?Q.car.map(k=>({adv:'advocacia',juiz:'magistratura',promotor:'Ministério Público',defensor:'Defensoria',academico:'academia'})[k]).join(', '):'nenhuma ainda'}</dd>
          <dt>Gerações no STF</dt><dd class="num">${Q.stf.length}</dd></dl>
        ${contaHtml()}
        ${S.vida.legado.length?`<span class="label">Gerações anteriores</span><ul class="log">${S.vida.legado.map(r=>`<li><span class="w">${r.geracao}ª</span><span>${esc(r.nome)} · ${r.carreira} · ${brl(r.patrimonio)}</span></li>`).join("")}</ul>`:''}
      </section>
      ${painelHall()}
    </div>

      <section class="panel"><div class="panel-head"><h2>Conquistas</h2><span class="label">${feitas} de ${CONQUISTAS.length} · ${cqPontos()} pontos da dinastia</span></div>
        <div class="bar"><i style="width:${feitas/CONQUISTAS.length*100}%;background:var(--brass)"></i></div>
        <p style="margin:0;font-size:12px;color:var(--muted)">As conquistas são da família: o herdeiro continua de onde a geração anterior parou. As que você já obteve em partidas antigas aparecem marcadas.</p></section>
      ${Object.entries(CQ_CAT).map(([k,n])=>{ const L=CONQUISTAS.filter(c=>c.cat===k);
        return `<section class="panel"><div class="panel-head"><h2>${n}</h2><span class="label">${L.filter(c=>Q.ids[c.id]).length} de ${L.length}</span></div><div class="cqs">${L.map(card).join('')}</div></section>`; }).join('')}
    </div>
  </div>`; }

    if(escolha.carreira==='defensor'){ iniciarDP(escolha.sede); S.log=[]; addLog(`Posse como ${fem('Defensor Público Substituto')} em ${CIDADES[escolha.sede].nome}. A fila de assistidos já está grande.`); }
    if(escolha.carreira==='promotor'){ iniciarMP(escolha.sede); S.log=[]; addLog(`Posse como ${fem('Promotor Substituto')} na comarca de ${CIDADES[escolha.sede].nome}. Você herdou 8 inquéritos.`); }
    if(escolha.carreira==='juiz'){ iniciarMagistratura(escolha.sede); S.log=[]; addLog(`Posse como ${fem('Juiz Substituto')} na comarca de ${CIDADES[escolha.sede].nome}. Você herdou um acervo de 8 processos.`); } view='escritorio'; sel={regiao:null,brasil:null,mundo:null}; regiaoSel=null; salvar(); render(); return; }
  if(!S) return;
  if(a==='view'){ view=v; render(); window.scrollTo(0,0); return; }
  if(a==='cidade'){ sel[view]=v; render(); return; }
  if(a==='regiao'){ regiaoSel=v; render(); return; }
  if(a==='abrirFilial'){ const C=LOC[v], custo=custoAbrir(C), tipo=TIPO[C.nivel];
    const ganho=C.nivel==='regional'?'O bairro passa a gerar 1 caso novo por semana':'A cidade passa a gerar 1 caso novo por semana, sem a penalidade de distância';
    modal(`<h2>Abrir ${tipo} em ${C.nome}?</h2><p>Custa ${brl(custo)} agora e ${brl(aluguel(C))} por semana.${C.nivel==='global'?' Inclui contratar um sócio local habilitado.':''} ${ganho}, e o seu limite de casos ativos sobe 1.</p>`,
      [{t:'Cancelar',v:0,cls:'ghost'},{t:'Abrir '+tipo,v:1,cls:'brass'}]).then(r=>{
        if(r && S && !motivoAbrir(v)){ S.caixa-=custo; S.filiais.push(v);
          addLog(`Nova ${tipo} em ${nomeLocal(v)} por ${brl(custo)}.`,'g'); salvar(); render(); } });
    return; }
  if(a==='aceitar'){ const c0=S.ofertas.find(x=>x.id===id); if(c0&&c0.npcJuiz&&!c0.etica&&npcTipo(npcPor(c0.npcJuiz))==='amigo'&&S.casos.length<maxCasos()){ eticaAmigoJuiz(c0); return; } const c=S.ofertas.find(x=>x.id===id); if(c&&S.casos.length<maxCasos()){ S.casos.push(c); S.ofertas=S.ofertas.filter(x=>x.id!==id); addLog(`Aceitou “${c.titulo}” (${RAR[c.rar].nome}, ${brl(c.valor)}).`);} }
  if(a==='recusar'){ S.ofertas=S.ofertas.filter(x=>x.id!==id); }
  if(a==='inc'||a==='dec'){ const d=a==='inc'?1:-1; if(d>0&&livres()<=0) return;
    if(b.dataset.k==='case'){ const c=S.casos.find(x=>x.id===id); c.semana=Math.max(0,(c.semana||0)+d); }
    else if(b.dataset.k==='dp'){ const c=S.d.casos.find(x=>x.id===id); c.semana=Math.max(0,(c.semana||0)+d); }
    else if(b.dataset.k==='inq'){ const c=S.p.casos.find(x=>x.id===id); c.semana=Math.max(0,(c.semana||0)+d); }

    else S.agenda[b.dataset.k]=Math.max(0,S.agenda[b.dataset.k]+d); }
  if(a==='estr'){ const c=S.casos.find(x=>x.id===id); c.estrategia=v; }
  if(a==='apoio'){ const c=S.casos.find(x=>x.id===id), ap=APOIOS[v], st=c.apoios[v]||0, custo=custoApoio(ap,c);
    if(st===0){ if(ap.blocos>livres()||S.caixa<custo) return; c.apoios[v]=1; S.caixa-=custo; if(ap.bad){ S.integ=clamp(S.integ-15,0,100); addLog(`Você usou um atalho antiético em “${c.titulo}”. −15 integridade.`,'r'); } }
    else if(st===1){ c.apoios[v]=0; S.caixa+=custo; if(ap.bad) S.integ=clamp(S.integ+15,0,100); } }
  if(a==='fimSemana'){ fimSemana(); return; }

  if(a==='promocao'){ S.carreira==='promotor'?promocaoMP():S.carreira==='defensor'?promocaoDP():promocao(); return; }

  if(a==='dpAcordo'){ dpAcordo(id); return; }
  if(a==='jConciliar'){ jConciliar(id); return; }
  if(a==='exonerar'){ exonerar(); return; }
  if(a==='moradia'){ comprarBem('moradia',+v); return; }
  if(a==='carro'){ comprarBem('carro',+v); return; }
  if(a==='quitar'){ quitarDivida(id); return; }
  if(a==='investir'){ investir(v); return; }
  if(a==='comprarAlug'){ comprarAluguel(+v); return; }
  if(a==='reformarAlug'){ reformarAluguel(id); return; }
  if(a==='venderAlug'){ venderAluguel(id); return; }
  if(a==='npc'){ acaoNPC(id,v); return; }

  if(a==='facEstagioSair'){ S.fac.estagio=null; S.agenda.estagio=0; salvar(); render(); return; }
  if(a==='facOAB'){ exameOAB(); return; }
  if(a==='acMatricular'){ acMatricular(v); return; }
  if(a==='acProjeto'){ acProjeto(v); return; }
  if(a==='acDocencia'){ acDocencia(v); return; }
  if(a==='acDocSair'){ S.ac.doc=null; S.agenda.docencia=0; addLog('Você deixou a docência.'); salvar(); render(); return; }
  if(a==='virarAcademico'){ virarAcademico(); return; }
  if(a==='aposentar'){ aposentar(); return; }
  if(a==='slot'){ S.u.sel=+v; render(); return; }
  if(a==='construir'){ construir(v); return; }
  if(a==='demolir'){ demolir(); return; }
  if(a==='mudarImovel'){ mudarImovel(); return; }
  if(a==='contratar'){ contratar(v); return; }
  if(a==='demitir'){ demitir(id); return; }
  if(a==='gestorF'){ S.u.gestorId=id; addLog(`${S.u.equipe.find(f=>f.id===id).nome} agora é o ${nomeGestor().toLowerCase()}.`); salvar(); render(); return; }
  if(a==='promoverF'){ promoverF(id); return; }

  if(a==='mpAcordo'){ mpAcordo(id); return; }
  if(a==='mpArquivar'){ mpArquivar(id); return; }

  if(a==='login'){ window.TOGA_ONLINE&&window.TOGA_ONLINE.login().catch(err=>modal(`<h2>Não foi possível entrar</h2><p>${esc(err.message||err)}</p>`,[{t:'Ok',v:1}])); return; }

// window.TOGA_ONLINE é criado por web/online.js; sem ele, tudo abaixo vira no-op e o jogo segue offline
const ON=()=>window.TOGA_ONLINE&&window.TOGA_ONLINE.ativo?window.TOGA_ONLINE:null;
function apagarSave(){ try{localStorage.removeItem('toga-proto');}catch(e){} const o=ON(); if(o) o.apagar(); }
function contaInner(){ const o=ON(); if(!o) return '';
  return o.logado?`<span>Conectado como <b>${esc(o.nome)}</b> · o progresso é salvo na nuvem.</span><button class="btn ghost" data-act="logout">Sair</button>`
    :`<span>Entre com Google para salvar o progresso na nuvem e continuar em outro aparelho.</span><button class="btn" data-act="login">Entrar com Google</button>`; }
const contaHtml=()=>`<div class="conta-box">${contaInner()}</div>`;
async function preencherHallOnline(){ const els=document.querySelectorAll('.hall-online'), o=ON(); if(!els.length) return;
  if(!o){ els.forEach(el=>el.innerHTML=''); return; }
  let L; try{ L=await o.topHall(20); }catch(e){ els.forEach(el=>el.innerHTML='<p class="label" style="margin:0">Ranking online indisponível agora.</p>'); return; }
  els.forEach(el=>{ const lim=+el.dataset.lim||10;
    el.innerHTML=`<span class="label">Ranking online · todos os jogadores</span>${L.length?`<ol class="hall">${L.slice(0,lim).map((v,i)=>`<li class="${i===0?'top':''}"><span class="num pos">${i+1}</span>
      <div><b>${esc(v.nome)}</b>${v.meu?' <span class="label hi">você</span>':''} <span class="label">${v.geracao}ª geração · ${v.idade} anos · ${MOTIVO_HALL[v.motivo]||esc(v.motivo)}</span><small>${esc(v.carreira)} · ${esc(v.resumo)} · prestígio ${v.prest} · ${brl(v.patrimonio)} · ${v.conq} conquista${v.conq===1?'':'s'}</small></div>
      <b class="num pts">${v.pontos}</b></li>`).join('')}</ol>`:'<p style="margin:0;color:var(--muted)">Ninguém entrou no ranking online ainda. Seja a primeira vida registrada.</p>'}`; }); }
function atualizarOnline(){ const hi=document.querySelector('.hall-inicio'); if(hi&&!hi.innerHTML.trim()&&ON()) hi.innerHTML=painelHall(5);
  document.querySelectorAll('.conta-box').forEach(el=>el.innerHTML=contaInner()); preencherHallOnline(); }
window.addEventListener('toga-online',atualizarOnline);
{ const r0=render; render=function(){ r0(); atualizarOnline(); }; }
